region_prompts:
- Calculate the square of n and print it, followed by a newline.
hints_by_type:
  code-completion:
  - Ask what “four groups of three” means. Which operation combines equal-sized groups?
  - Addition would count the two labels once each. Think about counting every item inside every box.
  multiple-choice-question:
  - Compare `int n{};` with a declaration that gives n an explicit starting number.
  - 'Empty braces have a specific meaning for an integer: they provide a starting value even without input.'
  free-coding:
  - Try the task by hand for n = 3 and n = −3. In both cases multiply the input by itself.
  - Use the existing n twice in one expression, send that result to std::cout, and finish the line. You do
    not need to change the input code.
  parsons-puzzles:
  - A variable must exist before a calculation can use it. Find the two starting quantities first.
  - The total needs both quantities. Printing needs the total. Which steps therefore have to come earlier?
  parameterized-code-tracing:
  - Write down the displayed boxes value and the fixed perBox value before doing arithmetic.
  - There is only one output statement. Multiply the two current values and write that one number.
completion_explanation: Multiplication counts every item in every box. Adding the quantities would count boxes
  and items-per-box as though they were the same kind of thing.
review_note: Reviewed for prerequisites, plain-language guidance, feedback, boundary cases, and C++23.
puzzle:
  source: |
    #include <iostream>
    int main() {
        int boxes{4};
        int perBox{3};
        int total{boxes * perBox};
        std::cout << total << '\n';
    }
  blocks:
  - snippet: '    int boxes{4};'
    explanation: Choose the number of boxes before the total can use it.
  - snippet: '    int perBox{3};'
    explanation: Choose how many items each box holds. This can be prepared before or after boxes.
  - snippet: '    int total{boxes * perBox};'
    explanation: Once both counts exist, multiply them to get the total.
  - snippet: '    std::cout << total << ''\n'';'
    explanation: Display the total only after it has been calculated.
  goal: Build a program that counts the items in four boxes with three items in each and prints that total.
  stdin: ''
  groups:
    0: starting-counts
    1: starting-counts
