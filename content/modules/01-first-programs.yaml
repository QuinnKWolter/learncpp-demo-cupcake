case_purposes:
- A positive input checks the basic multiplication.
- Zero checks that the result is calculated rather than replaced with a fixed positive answer.
- A negative input checks that both factors come from the same signed input.
- The largest permitted magnitude checks the complete stated input range.

completion_goal: "Count all items in four boxes with three items in each, then print the total."
