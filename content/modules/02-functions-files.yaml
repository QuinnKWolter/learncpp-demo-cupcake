hints_by_type:
  code-completion:
  - Locate the function body below main. The missing expression must calculate distance around all four sides.
  - A rectangle has two sides of each dimension. Add one width and one height, then account for the second
    pair.
  multiple-choice-question:
  - 'Separate two actions: returning a value to another part of the program and displaying text on the screen.'
  - The caller decides what to do with the returned number. Look for std::cout when deciding what actually
    gets printed.
  free-coding:
  - This task asks for area, not the perimeter in the example. Draw a rectangle with 3 rows of 5 squares.
  - Return one multiplication using the two parameter names. The supplied caller reads the dimensions and prints
    the returned value.
  parsons-puzzles:
  - A call can only use values already created. Look for the dimension declarations before the call.
  - After the call returns, its result can be printed. The function declaration and definition are already
    supplied around the movable part.
  parameterized-code-tracing:
  - Copy the displayed width and the fixed height into the function parameters for this call.
  - Calculate inside the function first. Then put its returned number into the output line; return itself does
    not create another output line.
completion_explanation: The perimeter counts both pairs of sides. Multiplying width by height calculates area
  instead; adding only once counts only half the boundary.
review_note: Reviewed for prerequisites, plain-language guidance, feedback, boundary cases, and C++23.
