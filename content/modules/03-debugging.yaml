    #include <iostream>
    int main() {
        int left{2}, right{9};
        int saved{left};
        left = right;
        right = saved;
        std::cout << left << ' ' << right << '\n';
    }
  blocks:
  - snippet: '    int saved{left};'
    explanation: Save the original left value before overwriting it.
  - snippet: '    left = right;'
    explanation: Move the original right value into left while saved protects the other original.
  - snippet: '    right = saved;'
    explanation: Finish by recovering the original left value from saved.
  - snippet: '    std::cout << left << '' '' << right << ''\n'';'
    explanation: Print after the whole swap is complete, so both positions show their final values.
