region_prompts:
- Calculate mean without losing a possible half point.
hints_by_type:
  code-completion:
  - Look at the operand types immediately before division. Are both still integers?
  - The conversion must happen before the fractional part is lost. Converting a finished integer quotient cannot
    bring it back.
  multiple-choice-question:
  - Evaluate the expression inside the braces first, using the types of 7 and 2.
  - Only after that expression finishes is its result used to initialize the double. Which information has
    already been discarded?
  free-coding:
  - Try scores 7 and 8 by hand. The total is odd, so an integer division would lose half a point.
  - Convert the total to double before dividing by two. Leave the supplied one-decimal-place output code as
    it is.
  parsons-puzzles:
  - The total and count must exist before they can be used in the quotient.
  - Make the fractional calculation before printing it; a display setting alone cannot fix integer division.
  parameterized-code-tracing:
  - First work out which division uses two integers. Then find the division with a double operand.
  - Track both results separately and preserve the space between them in the output.
completion_explanation: The conversion supplies a double operand before division. Without it, the calculation
  discards the fraction; the destination variable cannot recover it.
review_note: Reviewed for prerequisites, plain-language guidance, feedback, boundary cases, and C++23.
