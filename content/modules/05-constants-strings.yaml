hints_by_type:
  code-completion:
  - “Contains” means anywhere in the text, not only at the beginning.
  - The word cupcake ends with cake. A beginning-only check and an empty-string check ask different questions.
  multiple-choice-question:
  - 'Ask who actually stores the characters: the string, or the view looking at it?'
  - A view does not make its own copy. Its usefulness depends on the original characters still being available.
  free-coding:
  - Read the entire line before measuring it. An input like Ada Lovelace contains a space that should count.
  - getline leaves the ending newline out of the string. Its size therefore already matches the requested character
    count.
  parsons-puzzles:
  - Create the text before asking a question about its characters.
  - The printed result comes from the text operation, so the question must be evaluated before its result is
    sent to output.
  parameterized-code-tracing:
  - Use the text shown in your version of the program. Count its letters and spaces, not its quote marks.
  - The ending newline is an output instruction, not another character inside the stored word.
completion_explanation: contains searches the whole string. A word can contain cake even though it begins with
  cup, so starts_with would answer a different question.
review_note: Reviewed for prerequisites, plain-language guidance, feedback, boundary cases, and C++23.
puzzle:
  source: |
    #include <iostream>
    #include <string>
    int main() {
        const std::string word{"cupcake"};
        bool found{word.contains("cake")};
        std::cout << std::boolalpha << found << '\n';
    }
  blocks:
  - snippet: '    const std::string word{"cupcake"};'
    explanation: Create the owning text before searching it.
  - snippet: '    bool found{word.contains("cake")};'
    explanation: Ask the C++23 contains question and store its true/false answer.
  - snippet: '    std::cout << std::boolalpha << found << ''\n'';'
    explanation: Display the stored answer as a word, not a numeric flag.
  goal: Create the word cupcake, ask whether it contains cake, and print the Boolean answer as a word.
  stdin: ''
  groups: {}
