case_purposes:
- A space inside a name must be read and counted.
- An empty line is a real input with zero characters.
- Punctuation inside an ASCII word counts as characters too.
- A whitespace-only line must not be trimmed before measuring.

completion_goal: "Ask whether the text cupcake contains the smaller text cake anywhere inside it, and print the Boolean answer as a word."
