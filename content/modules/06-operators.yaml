case_purposes:
- The lower endpoint is allowed when it is even.
- The upper endpoint is allowed when it is even.
- A value inside the range still fails when odd.
- An even number is rejected when above the range.
- A negative even number still fails the lower bound.
- A value just below the lower endpoint must be rejected.

completion_goal: "Print true only when age is at least 12 and at most 17. Both endpoints belong to this range."
