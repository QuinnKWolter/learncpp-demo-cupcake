hints_by_type:
  code-completion:
  - Try an age just outside the group, such as 11. Which comparison fails, and should that be enough to reject
    it?
  - The range has two requirements, not two alternative ways to qualify. Choose an operator that requires both.
  multiple-choice-question:
  - Follow C++ evaluation from left to right for the first comparison. What kind of value does a comparison
    produce?
  - The second comparison receives true or false, not the original n. Write two separate comparisons joined
    by AND instead.
  free-coding:
  - 'List the three checks in words before writing symbols: lower bound, upper bound, evenness.'
  - An even number outside the interval must still be rejected. Join all three checks so none can be skipped
    as an alternative.
  parsons-puzzles:
  - Read the starting value, calculate the decision, then print that decision.
  - Use the Boolean variable after the declaration that creates it. The output line should not come before
    its value has been decided.
  parameterized-code-tracing:
  - Evaluate each age comparison separately. Write T or F beside each before combining them.
  - For AND, one false comparison makes the whole result false. The output is a word because boolalpha is supplied.
completion_explanation: AND requires both ends of the range to hold. OR would let an out-of-range value pass
  merely because it satisfies the other bound.
