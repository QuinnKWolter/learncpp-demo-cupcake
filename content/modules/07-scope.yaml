hints_by_type:
  code-completion:
  - Compare a fresh counter on each call with one counter that remembers the last issued number.
  - The initializer should run once, while the name remains inside the function. Which declaration gives that
    combination?
  multiple-choice-question:
  - Treat “where can I name it?” and “when is it destroyed?” as two separate questions.
  - 'A static local is the example that separates them: a local name, but a value that survives a return.'
  free-coding:
  - 'Do the conversion by hand: two hours contains twice as many minutes as one hour.'
  - The namespace and function signature are supplied. Return hours multiplied by the minutes in one hour;
    main already prints it.
  parsons-puzzles:
  - Create the call sequence in the same order that tickets should be issued.
  - The static counter belongs inside nextTicket. In main, each call should finish before the following result
    is printed.
  parameterized-code-tracing:
  - After a call returns, keep the ticket value in your table rather than resetting it to zero.
  - Prefix ++ changes the stored value before returning it. Apply that once for each displayed call.
completion_explanation: static preserves the counter between calls while keeping its name local. An ordinary
  local would start at zero again on every call.
review_note: Reviewed for prerequisites, plain-language guidance, feedback, boundary cases, and C++23.
puzzle:
  source: |
    #include <iostream>
    int nextTicket() {
        static int ticket{0};
        return ++ticket;
    }
    int main() {
        int first{nextTicket()};
        int second{nextTicket()};
        std::cout << first << ' ' << second << '\n';
    }
  blocks:
  - snippet: '    int first{nextTicket()};'
    explanation: Issue and retain the first ticket before requesting the second one.
  - snippet: '    int second{nextTicket()};'
    explanation: The same static counter continues from the first call, giving the next ticket.
  - snippet: '    std::cout << first << '' '' << second << ''\n'';'
    explanation: Print the first and second results in their issue order.
  goal: Request the first ticket, then the second, and print them in that order. nextTicket and its persistent
    counter are already supplied.
  stdin: ''
  groups: {}
