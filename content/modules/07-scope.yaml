  context: static int ticket{0};
  walkthrough:
  - snippet: static int ticket{0};
    note: On the first call only, initialize the remembered counter to zero.
    state:
      ticket: 0
  - snippet: return ++ticket;
    note: The first call increases the counter before returning it.
    state:
      ticket: 1
      returned value: 1
  - snippet: int first{nextTicket()};
    note: Keep that returned one as first.
    state:
      first: 1
  - snippet: return ++ticket;
    note: The next call reuses the counter, increasing one to two instead of initializing again.
    state:
      ticket: 2
      returned value: 2
  - snippet: int second{nextTicket()};
    note: Keep the second returned ticket separately.
    state:
      second: 2
  - snippet: std::cout << first << ' ' << second << '\n';
    note: 'Display the issue order: first, then second.'
