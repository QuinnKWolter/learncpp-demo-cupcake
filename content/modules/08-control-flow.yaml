hints_by_type:
  code-completion:
  - The goal includes the limit itself. Check what the condition does when i equals limit.
  - Compare the totals for limit 1. The loop should still add that one allowed value.
  multiple-choice-question:
  - List the i values that satisfy the condition, starting with the declared initial value.
  - The condition is tested before each body execution. Stop listing as soon as i is no longer less than three.
  free-coding:
  - Start with a running total of zero. What is the first positive even number you could add?
  - Advance the candidate by two each time and include n when it is even. Keep printing outside the loop so
    there is only one output line.
  parsons-puzzles:
  - A running total needs its starting value before the loop begins.
  - The final output uses the completed total, so it belongs after the whole loop block.
  parameterized-code-tracing:
  - Make columns for i and total. Update total inside the body, then update i before the next test.
  - For limit zero, the first condition already fails. For other limits, include the last value only if it
    still passes <=.
completion_explanation: The inclusive condition allows the final value to contribute. A strict less-than test
  would miss that last contribution.
review_note: Reviewed for prerequisites, plain-language guidance, feedback, boundary cases, and C++23.
