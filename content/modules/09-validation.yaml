region_prompts:
- Read and validate score, then print exactly one of pass, retry, or invalid.
hints_by_type:
  code-completion:
  - A parsed score of zero and a parsed score of 100 are both valid. Check both endpoints.
  - The range test must include equality and must require both bounds, not just either one.
  multiple-choice-question:
  - User input can be wrong during normal use. Its error handling must still work in a release build.
  - Assertions can be turned off. Use regular validation to decide what message a user should receive.
  free-coding:
  - 'Sort the situations into three groups before writing code: invalid input, valid passing score, valid retry
    score.'
  - Handle a failed read or bad range first. Only then test whether the valid score reaches 60; the final else
    covers the remaining valid scores.
  parsons-puzzles:
  - Reject invalid values before any branch can call them valid.
  - A successful conversion to int is only the first check. The allowed range is a separate decision.
  parameterized-code-tracing:
  - First decide whether the displayed score is inside the allowed range. If it is, choose the correct threshold
    branch.
  - Only one output branch is taken. Preserve the exact word selected by that branch.
completion_explanation: Both endpoints are valid, and both bounds must hold. Parsing an integer does not by
  itself establish that it is a permitted score.
review_note: Reviewed for prerequisites, plain-language guidance, feedback, boundary cases, and C++23.
