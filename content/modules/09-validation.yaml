objectives:
- Separate reading success from allowed values.
- Check threshold and range boundaries.
- Handle invalid input with a clear result.
lesson: |-
  ### Parsing a value is not the same as accepting it
  Input has two questions: “can I read an integer?” and “is that integer allowed?” The word oops fails the first question. The number 101 can be read as an integer but is outside the allowed score range. Both deserve a clear response.

  ```cpp
  if (!(std::cin >> score)) {
      std::cout << "invalid\n";
      return 0;
  }
  ```

  `if` runs its block only when the condition is true. Here the read can report failure; `!` reverses that result so the error block runs when reading fails. `return 0;` in main stops this run normally after printing its message. It avoids using the initial zero as though the user had entered a valid score.

  After a successful read, the example checks that the score is between 0 and 100, including both endpoints. An `else` block provides the alternative action when an if condition is false.

  ### Divide valid scores into two groups
  The coding task prints pass for 60 through 100 and retry for 0 through 59. It prints invalid for malformed input or an out-of-range integer. Check reading and range first. Then, among valid scores, compare with the pass threshold. `else if` tests the next condition only when the earlier one did not choose a block.

  The supplied tests each have a job: 60 tests the first passing score; 59 tests the neighboring retry score; zero and 100 test the valid endpoints; text and out-of-range values test rejection. A good repair follows one general rule for all of them.

  ### What an assertion is for
  An assertion (`assert`) checks a programmer's assumption, such as “this internal count should never be negative.” It can be disabled in a release build. It is not a reliable way to tell a user that their input is unacceptable. Explain why asks about this distinction; the coding task uses ordinary if/else handling instead.

  Step through follows one valid score, and Predict output varies that score. The puzzle puts validation before success output. None of these tasks asks you to keep retrying after a failed read: report the required result once and finish.
example: |
  #include <iostream>
  int main() {
      int score{};
      if (!(std::cin >> score)) {
          std::cout << "invalid\n";
          return 0;
      }
      if (score >= 0 && score <= 100) {
          std::cout << "valid\n";
      } else {
          std::cout << "invalid\n";
      }
  }
explanations:
- - '!(std::cin >> score)'
  - Try reading first. This condition becomes true if the input cannot be read as an integer.
- - return 0;
  - After reporting the bad read, stop main so the program does not continue with an untrusted value.
- - score >= 0 && score <= 100
  - A readable integer is acceptable only when it meets both bounds, including zero and 100.
blank: score >= 0 && score <= 100
wrong:
- - score > 0 && score < 100
  - The open comparisons reject zero and one hundred. These are explicitly valid endpoints, so both comparisons
    need to permit equality.
- - score >= 0 || score <= 100
  - OR treats either bound as sufficient. A score above one hundred still meets the lower bound and would incorrectly
    be accepted.
question: Why should a program validate external input instead of relying only on `assert`?
choices:
- - Input validation must still work when assertions are disabled.
  - Assertions check developer assumptions and may be absent in a release build. Normal invalid input needs
    ordinary program logic.
- - An assertion that passed during development must remain active in every release build.
  - Build settings can disable assertions. Passing an earlier test does not guarantee later input handling.
- - Initializing score to zero means a failed read is already a valid input.
  - A fallback initial value does not mean the user supplied that value. Check whether the read succeeded before
    accepting it.
task: Write the marked decision block to read and classify one score. Print pass for an integer from 60 through
  100, retry for an integer from 0 through 59, and invalid for a failed read or an integer outside 0–100. Input
  is one integer token or one nonnumeric word. Print exactly one result line.
solution: |
  #include <iostream>
  int main() {
      int score{};
      if (!(std::cin >> score) || score < 0 || score > 100) {
          std::cout << "invalid\n";
      } else if (score >= 60) {
          std::cout << "pass\n";
      } else {
          std::cout << "retry\n";
      }
  }
