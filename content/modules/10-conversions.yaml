hints_by_type:
  code-completion:
  - Compare “convert, then divide” with “divide, then convert.” In which order can the half still survive?
  - The conversion needs to affect an operand of /. A double destination alone comes too late.
  multiple-choice-question:
  - Look only at the initializer 6, not at how the variable might be used later.
  - auto uses the type of that expression. A plain whole-number literal here has type int.
  free-coding:
  - Use 9 and 2 as a trial input. The requested two-decimal answer needs to retain a half before formatting
    it.
  - Convert total before dividing by count. auto will then deduce the fractional result type.
  parsons-puzzles:
  - The input values must be ready before you calculate the quotient.
  - Keep the conversion next to the numerator in the calculation, then print the completed result.
  parameterized-code-tracing:
  - Work out each division independently. One is entirely integer arithmetic; the other has a converted operand.
  - Write both results in output order with the separating space. Do not give the integer expression a fraction
    just because the next expression has one.
completion_explanation: The operand conversion changes how division is performed. A conversion around a completed
  integer quotient would only convert the already truncated answer.
review_note: Reviewed for prerequisites, plain-language guidance, feedback, boundary cases, and C++23.
