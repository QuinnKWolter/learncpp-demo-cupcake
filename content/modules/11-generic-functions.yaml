objectives:
- Use one function template for integers and doubles.
- Follow a conditional result choice.
- Distinguish permitted compile-time and runtime evaluation.
lesson: |-
  ### One calculation, more than one numeric type
  Suppose we want the larger of two values. We could write one function for integers and another for doubles. Functions can share a name when their parameter lists differ; these are overloads. A **function template** lets us write one pattern for both cases instead.

  ```cpp
  template <typename T>
  constexpr T larger(T a, T b) {
      return a < b ? b : a;
  }
  ```

  Read T as “the type chosen for this call.” For `larger(3, 8)`, the compiler uses int. For `larger(2.5, 1.5)`, it uses double. Both arguments in these activities have the same type, so there is no ambiguous mixed-type call to resolve.

  ### Read the choice expression
  The conditional expression `condition ? whenTrue : whenFalse` chooses one of two values. Here, if a is less than b, return b; otherwise return a. Only one result is returned. This is a shorter way to write an if/else decision, not a new arithmetic operation.

  ### What constexpr promises
  A `constexpr` variable needs a value available while the program is being built. A `constexpr` function is allowed to calculate such a value when its inputs and use permit it. It can also run later with values read during execution. The example uses a compile-time call for best; the coding task uses runtime input. Explain why asks why those uses are both possible. C++23 has additional compile-time tools, but they do not change this distinction.

  ### Transfer the idea to a smaller-value function
  Write code supplies the template header and asks you to return the smaller of a and b. Keep the return type T and return one of the original values, rather than converting everything to int. The caller tests an integer pair and a fixed double pair, so a solution that quietly drops fractions will be exposed.

  Step through and Predict output follow a single larger-value call. Arrange code orders preparation, a call, and its output. When reasoning about any template here, first name the chosen type, then apply the ordinary comparison rule you already know.
example: |
  #include <iostream>
  template <typename T>
  constexpr T larger(T a, T b) {
      return a < b ? b : a;
  }
  int main() {
      constexpr int best{larger(3, 8)};
      std::cout << best << ' ' << larger(2.5, 1.5) << '\n';
  }
explanations:
- - template <typename T>
  - This function is a pattern. The call chooses the type represented by T.
- - 'a < b ? b : a'
  - If a is smaller, choose b; otherwise choose a. This returns the larger value without changing either argument.
- - constexpr int best{larger(3, 8)};
  - This variable requires its initial value during the build, so this call is evaluated then.
- - larger(2.5, 1.5)
  - This call uses double for T. The function pattern also works without throwing away fractional information.
blank: 'a < b ? b : a'
wrong:
- - 'a < b ? a : b'
  - These result branches select the smaller value. Use the same comparison with the opposite result positions
    to implement the requested larger value.
- - a + b
  - Adding the arguments combines them into a different number. This function must choose and return one of
    the existing arguments.
question: Must every call of a constexpr function run during compilation?
choices:
- - No; a constexpr function may also be called with runtime values.
  - constexpr permits constant evaluation when the call and its context support it; it does not require every
    call to happen during a build.
- - Yes; constexpr forces every call to run before the program starts.
  - A normal call can receive a value read from input, which is unavailable during compilation.
- - No runtime call is allowed because the compiler only accepts literal arguments.
  - The function can accept runtime arguments too. A context that specifically requires a constant expression
    has the extra restriction.
task: Complete the supplied function template `smaller(T a, T b)`. Return the smaller of a and b; do not print
  from the function. The caller reads two integers from −1000 to 1000 and also calls your function with 2.5
  and 1.5. It prints the two results on one line. Keep the result type T so both integer and fractional values
  are handled.
solution: |
  #include <iostream>
  template <typename T>
  constexpr T smaller(T a, T b) {
      return a < b ? a : b;
  }
  int main() {
      int a{}, b{};
      std::cin >> a >> b;
      std::cout << smaller(a, b) << ' ' << smaller(2.5, 1.5) << '\n';
  }
editable: '    return a < b ? a : b;'
