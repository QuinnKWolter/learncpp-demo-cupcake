hints_by_type:
  code-completion:
  - 'Read the expression as an if/else: when a < b, which variable is larger?'
  - The true and false positions have different jobs. Test them with a small pair in increasing order, then
    with the order reversed.
  multiple-choice-question:
  - Compare a fixed literal used during a build with a value that arrives from std::cin during execution.
  - constexpr permits compile-time calculation when possible; an ordinary runtime call can still use the same
    function.
  free-coding:
  - Use a small ordered pair such as 2 and 7 to decide which value belongs in each branch.
  - Then reverse the pair to check the other branch. Return the original T value so the fixed double example
    keeps its fractional part.
  parsons-puzzles:
  - The values must exist before a call can receive them, and a result must be calculated before it can be
    printed.
  - The template definition is already supplied. You are ordering one caller’s steps, not arranging template
    syntax.
  parameterized-code-tracing:
  - Give a and b the displayed argument values, then evaluate a < b once.
  - Only the selected branch becomes the returned value; the two values are not added together.
completion_explanation: When a < b, b is the larger value. Reversing the two result positions would correctly
  implement a smaller-value function, but not this larger-value function.
review_note: Reviewed for prerequisites, plain-language guidance, feedback, boundary cases, and C++23.
puzzle:
  source: |
    #include <iostream>
    template <typename T>
    constexpr T larger(T a, T b) { return a < b ? b : a; }
    int main() {
        int a{3}, b{8};
        auto result{larger(a, b)};
        std::cout << result << '\n';
    }
  blocks:
  - snippet: '    int a{3}, b{8};'
    explanation: Prepare the argument values before calling the template.
  - snippet: '    auto result{larger(a, b)};'
    explanation: Deduce T as int for this call and keep its returned larger value.
  - snippet: '    std::cout << result << ''\n'';'
    explanation: Display the returned result; the template itself does not print.
  goal: Prepare the pair 3 and 8, call the supplied larger template, and print its returned value.
  stdin: ''
