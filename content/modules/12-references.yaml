puzzle:
  source: |
    #include <iostream>
    int main() {
        int score{10};
        int& alias{score};
        alias += 5;
        std::cout << score << '\n';
    }
  blocks:
  - snippet: '    int score{10};'
    explanation: The actual integer must exist before a reference can name it.
  - snippet: '    int& alias{score};'
    explanation: Bind another name to that same integer; do not create a separate copy.
  - snippet: '    alias += 5;'
    explanation: Modify the shared integer through its reference.
  - snippet: '    std::cout << score << ''\n'';'
    explanation: Read the updated object through its original name.
  goal: Create score, bind an alias to it, increase the shared value by five, then print score.
  stdin: ''
  groups: {}
