hints_by_type:
  code-completion:
  - Ask whether addBonus should change a private copy or the caller’s actual score.
  - The body adds to score. A const reference would prevent that; a by-value parameter would change only a
    copy.
  multiple-choice-question:
  - Follow the local integer’s lifetime through the end of its function call.
  - Copying an address does not keep the addressed object alive. Ask whether there is still a valid object
    to use after return.
  free-coding:
  - 'There are two cases: a negative value must change; zero or a positive value must stay as it is.'
  - Use an if condition and assign through the supplied reference only in the negative case. The caller will
    observe that same integer.
  parsons-puzzles:
  - Create a live integer before binding a reference to it.
  - A change through the reference affects that integer. Print after the change so the effect is visible.
  parameterized-code-tracing:
  - Draw one box for the integer and connect both the original name and its reference to it.
  - An assignment through the alias changes that one box. Read the original name from the updated box when
    printing.
completion_explanation: The reference lets the function update the caller’s score. A value parameter would
  update only a copy; a const reference would prohibit this update.
