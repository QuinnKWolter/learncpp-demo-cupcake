case_purposes:
- Both directions move independently with positive offsets.
- Signed movement must affect only its matching coordinate.
- Zero movement should return the original coordinates.

completion_goal: "Print the parcel's weight only when its stored status is ready. Check the named status rather than inferring readiness from the weight."
