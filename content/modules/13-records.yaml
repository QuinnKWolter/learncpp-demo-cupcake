hints_by_type:
  code-completion:
  - Look at the status used when parcel is created. Which named status should the condition recognize?
  - Weight and status answer different questions. The decision asks whether this parcel is ready, not whether
    it weighs zero.
  multiple-choice-question:
  - Status names a type that owns the enumerator names, rather than an object with data members.
  - Use the same scope-separator idea as units::toMinutes. No call is needed to obtain a named enum value.
  free-coding:
  - 'Keep the two directions separate: x changes by dx, and y changes by dy.'
  - Construct the returned Point in its declared member order. Zero movement should return the original coordinates.
  parsons-puzzles:
  - The record needs to exist before the program can inspect its members.
  - A test of status chooses whether to print the weight. Keep the print in the intended branch.
  parameterized-code-tracing:
  - Match the two initializers to the members in declaration order.
  - Select the status branch first. Only then decide which weight, if any, reaches the output statement.
completion_explanation: The condition checks the parcel’s named status. Its numeric weight does not tell us
  whether it is ready.
review_note: Reviewed for prerequisites, plain-language guidance, feedback, boundary cases, and C++23.
puzzle:
  source: |
    #include <iostream>
    enum class Status { waiting, ready };
    struct Parcel { int weight{}; Status status{Status::waiting}; };
    int main() {
        Parcel parcel{4, Status::ready};
        parcel.weight += 2;
        if (parcel.status == Status::ready) {
            std::cout << parcel.weight << '\n';
        }
    }
  blocks:
  - snippet: '    Parcel parcel{4, Status::ready};'
    explanation: Create both named record members in their declaration order.
  - snippet: '    parcel.weight += 2;'
    explanation: Update the weight member of the existing record before displaying it.
  - snippet: |2-
          if (parcel.status == Status::ready) {
              std::cout << parcel.weight << '\n';
          }
    explanation: Check the scoped status value and print the updated weight for a ready parcel.
  goal: Create a ready parcel of weight 4, add 2 to its weight, and print the updated weight only when ready.
  stdin: ''
  groups: {}
