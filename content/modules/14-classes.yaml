region_prompts:
- Accept a positive amount and update value_; leave it unchanged otherwise.
hints_by_type:
  code-completion:
  - An increment means one step upward from the current count, not a new starting value.
  - Use an operation that changes the stored value by one while preserving all earlier increments.
  multiple-choice-question:
  - If a caller could assign any value directly, could the class enforce its accepted-update rule?
  - Private storage makes callers request an operation. The method can check the request before changing that
    storage.
  free-coding:
  - Decide whether the requested amount is allowed before changing value_.
  - A rejected zero or negative amount should leave the stored value exactly as it was. Update only in the
    positive branch.
  parsons-puzzles:
  - Create a Counter before calling a member function on it.
  - Reading the count before increment would show the old value. Put the observer after the update when the
    task asks for the final count.
  parameterized-code-tracing:
  - Keep one row for the object’s stored value. Check the add method’s condition before updating it.
  - The observer returns what is currently stored; it does not add again or reset anything.
completion_explanation: Increment increases the existing count by one. Resetting it would discard its history;
  decrement would move it in the opposite direction.
review_note: Reviewed for prerequisites, plain-language guidance, feedback, boundary cases, and C++23.
