region_prompts:
- Count the elements greater than zero, then return the count.
hints_by_type:
  code-completion:
  - Sort needs the start of the list and the position just beyond its final element.
  - A range that begins and ends at begin contains no elements. A range ending one element later is still too
    short for the whole vector.
  multiple-choice-question:
  - Distinguish making room from creating items. Which operation changes capacity without changing size?
  - After reserve, ask how many integers have actually been inserted or created. Empty reserved storage is
    not a list of elements yet.
  free-coding:
  - Start count at zero and inspect each stored integer. Zero itself should not count as positive.
  - Increase count only in the value > 0 case, then return once the loop has finished. An empty list should
    naturally return the starting zero.
  parsons-puzzles:
  - Create the vector before using begin and end to describe it.
  - The range loop prints the current order. Put sorting before it if the required display is sorted.
  parameterized-code-tracing:
  - Visit the displayed values in order, adding one to count only for a strictly positive value.
  - Keep zero separate from positive values. The final output is the count, not the sum of the positive values.
completion_explanation: end marks the boundary after the last element, so the half-open range covers the entire
  vector. An earlier boundary would leave some values unsorted.
review_note: Reviewed for prerequisites, plain-language guidance, feedback, boundary cases, and C++23.
