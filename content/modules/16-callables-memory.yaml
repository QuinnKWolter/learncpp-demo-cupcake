case_purposes:
- Zero is the direct stopping case; no recursive call is needed.
- One reaches the stopping case after one smaller request.
- Several levels check the return path as well as descent.
- The upper input bound checks progress and the full resulting sum.

completion_goal: "Make addBonus retain a copy of bonus when the lambda is created. Later changes to the original should not affect that saved copy."
