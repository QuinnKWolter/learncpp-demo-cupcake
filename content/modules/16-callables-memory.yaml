hints_by_type:
  code-completion:
  - Look at when the lambda is created and when bonus changes. Should its saved bonus follow that later change?
  - A value capture stores a copy at creation time. A reference capture follows the original instead. Choose
    the one that preserves the original bonus.
  multiple-choice-question:
  - The zero case must be reached without first making yet another recursive call.
  - Changing n toward zero is necessary, but at zero the function must return an answer directly. Check the
    order of those two decisions.
  free-coding:
  - First decide what the sum should be when there is nothing to add. That case should return without calling
    sumTo again.
  - For a positive n, combine n with the sum for the smaller input n − 1. Eventually that smaller input reaches
    your stopping case.
  parsons-puzzles:
  - Capture a value before changing the original if you want the function to retain the earlier value.
  - The later call uses whichever value was captured at creation. Put the final print after the original has
    changed so the difference is observable.
  parameterized-code-tracing:
  - Make separate rows for the original bonus and the copy kept by the lambda.
  - The later assignment changes only the original row. Add the call argument to the captured row when predicting
    output.
completion_explanation: A value capture keeps the earlier bonus. Reference capture would make the same body
  observe the later assignment instead.
