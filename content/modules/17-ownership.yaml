case_purposes:
- The total is new, while both original operands must retain their values.
- Two zero values remain valid value objects.
- Unequal operands help catch a function that accidentally reuses only one member.
- Large values must be added without mutating either original.

completion_goal: "Transfer the owned integer from first to second, so second owns it and first is empty afterward."
