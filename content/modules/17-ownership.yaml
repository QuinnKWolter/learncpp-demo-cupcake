hints_by_type:
  code-completion:
  - unique_ptr represents one owner. Ask whether the second line should copy ownership or transfer it.
  - The original object should survive, but its responsible owner should change. Creating a different integer
    does not achieve that.
  multiple-choice-question:
  - Follow the ownership transfer, not just the address or stored number.
  - After a unique_ptr move, the source is empty and the destination is responsible for the original object.
  free-coding:
  - The function should produce a new value while leaving both inputs alone. Read their points members and
    combine those numbers.
  - Use Score{...} to create the returned record. Do not update either const-reference operand; the caller
    prints them to check this promise.
  parsons-puzzles:
  - An owner must exist before its ownership can be transferred.
  - Read through the destination after the transfer. The source unique_ptr is empty at that point.
  parameterized-code-tracing:
  - 'Keep two facts separate: which pointer owns the object, and what integer the object holds.'
  - Moving this owner changes responsibility, not the stored integer. The original == nullptr question therefore
    has its own Boolean answer.
completion_explanation: std::move permits transfer of exclusive ownership. Copying would try to give the same
  object two unique owners; creating a new zero-valued object would not transfer the original.
review_note: Reviewed for prerequisites, plain-language guidance, feedback, boundary cases, and C++23.
