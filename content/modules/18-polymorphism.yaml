hints_by_type:
  code-completion:
  - The call is written through Base&. Which base declaration enables it to select the actual Derived object’s
    operation?
  - A same-named nonvirtual function is not enough for dispatch through a base reference. The base must declare
    this as a virtual operation.
  multiple-choice-question:
  - Compare a reference to the original Derived with a new Base object copied from it.
  - The new Base stores only the Base portion. No later call can restore a discarded derived portion.
  free-coding:
  - The constructor has already saved both dimensions. Area counts rows times columns, not the distance around
    the edges.
  - Return the product of width_ and height_. Keep the supplied const override signature so the call through
    const Shape& can use it.
  parsons-puzzles:
  - Create the Derived object before making a reference to it.
  - Bind the general reference to that existing object, then call the virtual operation through the reference.
  parameterized-code-tracing:
  - Name the actual object type separately from the reference type.
  - For a virtual call through a reference to Derived, use Derived’s body even though the reference is declared
    Base&.
completion_explanation: virtual in the base enables dispatch through Base&. Removing it would make this call
  use Base’s operation even though the original object is Derived.
