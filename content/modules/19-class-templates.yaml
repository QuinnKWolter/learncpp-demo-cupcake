hints_by_type:
  code-completion:
  - 'Read the observer’s name literally: it should give back the value already stored in this box.'
  - Creating a fresh T{} would return a default value, and adding the member to itself would double it. Neither
    is an observation of the original value.
  multiple-choice-question:
  - Compare “same source pattern” with “same completed type.” What argument was substituted for T in each case?
  - The different template argument lists are part of the type names, so the two instantiations are not the
    same type.
  free-coding:
  - The constructor has already stored the two T values. The observer only needs to combine them.
  - Add first_ and second_ directly and return that result. Preserve T so the fractional pair can return a
    fractional sum.
  parsons-puzzles:
  - Choose and construct the concrete box before asking its observer for a value.
  - Printing the observed value is the last step. The supplied class definition handles the type pattern and
    storage.
  parameterized-code-tracing:
  - Replace T with the concrete type named in the program, then record the value supplied to that box’s constructor.
  - The observer does not modify the member; use the same stored number when predicting the print.
completion_explanation: Returning the existing member preserves exactly what was stored. A default-constructed
  T or a doubled member would answer a different question.
review_note: Reviewed for prerequisites, plain-language guidance, feedback, boundary cases, and C++23.
