hints_by_type:
  code-completion:
  - Division fails when the divisor is zero, not when the dividend is zero.
  - Try the valid calculation zero divided by three. Rejecting a zero numerator would incorrectly reject that
    case.
  multiple-choice-question:
  - Think about a local owner whose scope is left when a calculation throws.
  - Stack unwinding performs the cleanup of fully constructed local objects; it does not limit cleanup only
    to the exception object.
  free-coding:
  - First try to read both required integers. A successful first read alone is not enough.
  - Then look for one extra non-whitespace token. Accept only when the required reads succeeded and that extra
    read did not.
  parsons-puzzles:
  - The try block contains the operation that can fail; the matching handler deals with its thrown exception.
  - The output after a successful call belongs on the normal path. The handler’s output belongs only on the
    failure path.
  parameterized-code-tracing:
  - Check the denominator before doing any arithmetic. If it is zero, follow the throw into the handler.
  - A throw stops the rest of that try path. Predict only the output statements actually reached.
completion_explanation: Only a zero denominator makes this integer division invalid. Checking the numerator
  would reject a valid zero result and miss the actual error.
