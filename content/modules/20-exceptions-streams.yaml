case_purposes:
- Exactly two readable integer fields are a valid record.
- Surrounding whitespace is allowed and a negative value still parses.
- One field is not a complete two-field record.
- A third integer is an unwanted extra token.
- A word in a required integer position must be rejected.
- A readable integer prefix followed by letters is not a complete clean record.
- An empty line contains neither required field.
- Two signed integers still use ordinary addition.

completion_goal: "Make checkedDivide reject a zero denominator with an exception while allowing division by a nonzero denominator, including a zero numerator."
