  hint: Check every rejection condition before changing stock. Then update it once and report success.
  lesson: |-
    ### A small inventory with one clear rule
    An inventory stores a nonnegative number of items. Its class already has a constructor and a stock observer. You write two public actions. Each action first decides whether a request is allowed, then either changes the stock once or rejects the request without changing anything.

    `add(amount)` accepts only a positive amount. `take(amount)` also requires that the stock can cover the full amount. For both actions, return true when accepted and false when rejected. This return value is separate from the stored stock: main prints both the decision and the new stock after each command.

    ### Read the supplied caller
    Input begins with initial stock and the number of commands. Each later command is add or take followed by its amount. The loop reads one command at a time. Its conditional expression chooses the matching method. The output uses the returned bool to select ok or rejected, then reads the current stock through the observer. You do not need to change this caller.

    ### Work in two passes
    Complete add first and test a positive, zero, and negative amount. Then complete take and test a small permitted withdrawal, an exact-stock withdrawal, an overdraft, and a zero/negative request. Keep your rejection checks before the update so a failed request cannot change the state.

    The two highlighted editor regions are independent method bodies. The read-only surrounding code supplies the names and input/output. In a no-commands case no transaction result is printed; an empty output is correct.
  hints:
  - Separate the decision from the update. Reject any invalid amount before touching stock_.
  - For take, ask both “is it positive?” and “is there enough stock?” Exact-stock withdrawal is allowed.
  - After an accepted update, return true. A rejected request must return false with stock_ exactly as it was.
  region_prompts:
  - Accept a positive add, update stock_, and return whether it succeeded.
  - Accept a positive take that stock_ can cover; update only when accepted.
  case_purposes:
  - A transaction sequence checks accepted changes, overdraft rejection, and an exact-stock take.
  - Zero and negative amounts must be rejected without changing the count.
  - An empty inventory can accept stock later and then permit an exact take.
  - With no commands, no transaction result lines should be printed.
- slug: capstone-02-report
  title: 'Capstone: validated score reports'
  after: 20
  chapters: 1–28
  topics:
  - structs
  - vector
  - streams
  - validation
  - algorithms
  objectives:
  - Validate a complete input record.
  - Combine a vector of records into a deterministic report.
  task: Implement `bool parseRecord(const std::string& line, Record& result)` and `void printReport(const std::vector<Record>&
    records)`. A valid line contains exactly a single-word name and one integer score in [0,100], with no extra
    token. parseRecord returns false for any invalid line and assigns result only for a valid line. main reads
    a nonnegative line count followed by those lines (at most 100). If any line is invalid, main prints `invalid`
    and stops. Otherwise print `count N`, `average A` with one decimal place, and `best NAME SCORE` on separate
    lines. For an empty collection print `count 0`, `average 0.0`, and `best none`. For a tie, select the FIRST
    record with the highest score. Names contain only ASCII letters; test inputs obey the line-count contract.
  solution: |
    #include <iomanip>
    #include <iostream>
    #include <limits>
    #include <sstream>
    #include <string>
    #include <vector>
    struct Record { std::string name; int score{}; };
    bool parseRecord(const std::string& line, Record& result) {
        std::istringstream input{line};
        Record candidate;
        std::string extra;
        if (!(input >> candidate.name >> candidate.score) || candidate.score < 0 || candidate.score > 100 || (input >> extra)) {
            return false;
        }
        result = candidate;
        return true;
    }
    void printReport(const std::vector<Record>& records) {
        int total{0};
        const Record* best{nullptr};
        for (const Record& record : records) {
            total += record.score;
            if (best == nullptr || record.score > best->score) { best = &record; }
        }
        double average{records.empty() ? 0.0 : static_cast<double>(total) / records.size()};
        std::cout << "count " << records.size() << '\n';
        std::cout << "average " << std::fixed << std::setprecision(1) << average << '\n';
        if (best) { std::cout << "best " << best->name << ' ' << best->score << '\n'; }
        else { std::cout << "best none\n"; }
    }
    int main() {
        int count{};
        std::cin >> count;
        std::cin.ignore(std::numeric_limits<std::streamsize>::max(), '\n');
        std::vector<Record> records;
        for (int i{0}; i < count; ++i) {
            std::string line;
            std::getline(std::cin, line);
            Record record;
            if (!parseRecord(line, record)) { std::cout << "invalid\n"; return 0; }
            records.push_back(record);
        }
        printReport(records);
    }
