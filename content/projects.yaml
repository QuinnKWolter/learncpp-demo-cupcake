- slug: capstone-01-stock
  title: 'Capstone: a small stock controller'
  after: 14
  chapters: 1–15
  topics:
  - classes
  - invariants
  - control-flow
  - input-validation
  objectives:
  - Preserve a class invariant across a sequence of commands.
  - Reject invalid transactions without changing stock.
  task: Implement the Inventory methods. Initial stock is nonnegative. `add(amount)` returns true and adds
    amount only when amount > 0. `take(amount)` returns true and subtracts amount only when 0 < amount <= stock.
    A rejected request returns false and leaves stock unchanged. Input is initial-stock and command-count,
    then that many `add n` or `take n` commands. Print `ok stock` or `rejected stock` after each command. Initial
    stock, command count, and all amounts have magnitude at most 100; command count is nonnegative.
  solution: |
    #include <iostream>
    #include <string>
    class Inventory {
        int stock_;
    public:
        explicit Inventory(int initial) : stock_{initial} {}
        bool add(int amount) {
            if (amount <= 0) { return false; }
            stock_ += amount;
            return true;
        }
        bool take(int amount) {
            if (amount <= 0 || amount > stock_) { return false; }
            stock_ -= amount;
            return true;
        }
        int stock() const { return stock_; }
    };
    int main() {
        int initial{}, commands{};
        std::cin >> initial >> commands;
        Inventory inventory{initial};
        for (int i{0}; i < commands; ++i) {
            std::string action;
            int amount{};
            std::cin >> action >> amount;
            bool accepted{action == "add" ? inventory.add(amount) : inventory.take(amount)};
            std::cout << (accepted ? "ok " : "rejected ") << inventory.stock() << '\n';
        }
    }
