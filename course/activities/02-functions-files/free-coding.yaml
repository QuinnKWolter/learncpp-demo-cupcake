testcases:
- title: Rectangle
  visible: true
  stdin:
  - 3 5
  stdout: |
    15
  feedback:
    on_pass:
    - Different dimensions distinguish area from adding side lengths.
    on_fail:
    - Different dimensions distinguish area from adding side lengths. This task asks for area, not the perimeter
      in the example. Draw a rectangle with 3 rows of 5 squares.
- title: Square
  visible: true
  stdin:
  - 4 4
  stdout: |
    16
  feedback:
    on_pass:
    - A square still uses multiplication, not a special-case formula.
    on_fail:
    - A square still uses multiplication, not a special-case formula. This task asks for area, not the perimeter
      in the example. Draw a rectangle with 3 rows of 5 squares.
- title: Thin rectangle
  visible: true
  stdin:
  - 1 9
  stdout: |
    9
  feedback:
    on_pass:
    - A dimension of one should leave the other as the area.
    on_fail:
    - A dimension of one should leave the other as the area. This task asks for area, not the perimeter in
      the example. Draw a rectangle with 3 rows of 5 squares.
- title: Larger dimensions
  visible: true
  stdin:
  - 1000 2
  stdout: |
    2000
  feedback:
    on_pass:
    - Larger dimensions help reject a hard-coded answer based on a small example.
    on_fail:
    - Larger dimensions help reject a hard-coded answer based on a small example. This task asks for area,
      not the perimeter in the example. Draw a rectangle with 3 rows of 5 squares.
