runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iostream>
    int rectangleArea(int width, int height) {
        return width * height;
    }
    int main() {
        int width{}, height{};
        std::cin >> width >> height;
        std::cout << rectangleArea(width, height) << '\n';
    }
statement: |-
  A rectangle’s area is width × height. Complete `rectangleArea(int width, int height)` by returning that area. The supplied code reads two whole numbers from 1 to 1000 and prints the returned result. Edit only the marked function body; it should return a number, not print it.

  Edit only the marked region. The other code is supplied for you to read and use. Check Answer tries the listed inputs; use their feedback to find which part of the rule needs another look.
hints:
- This task asks for area, not the perimeter in the example. Draw a rectangle with 3 rows of 5 squares.
- Return one multiplication using the two parameter names. The supplied caller reads the dimensions and prints
  the returned value.
