runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iostream>
    int rectanglePerimeter(int width, int height) {
        return 2 * (width + height);
    }
    int main() {
        int width{3};
        int height{5};
        std::cout << rectanglePerimeter(width, height) << '\n';
    }
statement: |-
  Follow one fixed version of this module’s program. The width changes. Follow the call into the visible perimeter function and predict its returned result on the one output line.

  Use Step to advance one explained state at a time. The highlighted line is the one just explained. These state labels are a teaching diagram, not the compiler’s physical memory layout. Predict output later gives you a changing version to solve yourself.
