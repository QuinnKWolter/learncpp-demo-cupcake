$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/macro-visualization/0.1.0
license: MIT
locale: en-US
id: cpp23-v2-05-constants-strings-macro-visualization
title: Constants and text with clear lifetimes · step through
description: Practice constants and text with clear lifetimes.
pedagogy:
  activity: macro-visualization
  difficulty: novice
  prereq_topics:
  - integers
  - floating-point
  - integer-division
  - type-conversion
  topics:
  - const
  - constexpr
  - strings
  - string-lifetimes
runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iostream>
    #include <string>
    int main() {
        const std::string word{"cat"};
        std::cout << word.size() << '\n';
    }
statement: |-
  Follow one fixed version of this module’s program. The stored text changes. Count its ASCII characters, including any spaces, and predict the printed length.

  Use Step to advance one explained state at a time. The highlighted line is the one just explained. These state labels are a teaching diagram, not the compiler’s physical memory layout. Predict output later gives you a changing version to solve yourself.
elements:
- settings:
    code: top
    heapHeight: 10
    stackHeight: 220
    width: 900
  init:
  - - createFrame
    - 0
    - Guided C++23 state
  - - createVariable
    - word
  - - createVariable
    - length
  - - createVariable
    - output
  - - setLine
    - 2
  - - showText
    - Choose Step to begin. Follow the highlighted line, state labels, and explanation together.
  steps:
  - - _setLine
    - 4
  - - _addValue
    - cat
    - 0
    - std::string
  - - _assign
    - word
  - - showText
    - Store the three letters c, a, and t. The quote marks delimit the text; they are not stored characters.
  - - _setLine
    - 5
  - - _addValue
    - '3'
    - 0
    - int
  - - _assign
    - length
  - - showText
    - Ask how many characters are stored. No newline was stored in this literal.
  - - _setLine
    - 5
  - - _addValue
    - '3'
    - 0
    - std::string
  - - _assign
    - output
  - - showText
    - Print the length, then add an output newline.
  lines:
  - '#include <iostream>'
  - '#include <string>'
  - int main() {
  - '    const std::string word{"cat"};'
  - '    std::cout << word.size() << ''\n'';'
  - '}'
