$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/worked-example/0.1.0
license: MIT
locale: en-US
id: cpp23-v2-06-operators-worked-example
title: Operators, conditions, and bit flags · worked example
description: Practice operators, conditions, and bit flags.
pedagogy:
  activity: worked-example
  difficulty: novice
  prereq_topics:
  - const
  - constexpr
  - strings
  - string-lifetimes
  topics:
  - operators
  - precedence
  - remainder
  - boolean-logic
  - bit-flags
runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iostream>
    int main() {
        int age{16};
        std::cin >> age;
        bool eligible{age >= 12 && age <= 17};
        std::cout << std::boolalpha << eligible << '\n';
    }
statement: Read the small program and predict its result. Click the underlined pieces of code to see what each
  one contributes. Then compare your prediction with the sample run.
executions:
- title: Sample run
  stdin:
  - '16'
  stdout: |
    true
  console: |
    true
  status: pass
elements:
- type: explanation
  location:
    snippet: std::cin >> age;
  explanations:
  - body: The initial 16 is replaced by the supplied input for this run. Check the sample input before predicting
      the result.
- type: explanation
  location:
    snippet: age >= 12 && age <= 17
  explanations:
  - body: Ask both range questions. Ages 12 and 17 are included because each comparison permits equality.
- type: explanation
  location:
    snippet: std::boolalpha
  explanations:
  - body: The resulting bool is printed as true or false instead of as a digit.
