$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/macro-visualization/0.1.0
license: MIT
locale: en-US
id: cpp23-v2-07-scope-macro-visualization
title: Scope, duration, and linkage · step through
description: Practice scope, duration, and linkage.
pedagogy:
  activity: macro-visualization
  difficulty: novice
  prereq_topics:
  - operators
  - precedence
  - remainder
  - boolean-logic
  - bit-flags
  topics:
  - scope
  - namespaces
  - shadowing
  - static-duration
  - linkage
runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iostream>
    int nextTicket() {
        static int ticket{0};
        return ++ticket;
    }
    int main() {
        int first{nextTicket()};
        int second{nextTicket()};
        std::cout << first << ' ' << second << '\n';
    }
statement: |-
  Follow one fixed version of this module’s program. The static counter’s starting value changes. Predict the first and second tickets, remembering the counter between calls.

  Use Step to advance one explained state at a time. The highlighted line is the one just explained. These state labels are a teaching diagram, not the compiler’s physical memory layout. Predict output later gives you a changing version to solve yourself.
elements:
- settings:
    code: top
    heapHeight: 10
    stackHeight: 220
    width: 900
  init:
  - - createFrame
    - 0
    - Guided C++23 state
  - - createVariable
    - ticket
  - - createVariable
    - returned value
  - - createVariable
    - first
  - - createVariable
    - second
  - - createVariable
    - output
  - - setLine
    - 2
  - - showText
    - Choose Step to begin. Follow the highlighted line, state labels, and explanation together.
  steps:
  - - _setLine
    - 3
  - - _addValue
    - '0'
    - 0
    - int
  - - _assign
    - ticket
  - - showText
    - On the first call only, initialize the remembered counter to zero.
  - - _setLine
    - 4
  - - _addValue
    - '1'
    - 0
    - int
  - - _assign
    - ticket
  - - _addValue
    - '1'
    - 0
    - int
  - - _assign
    - returned value
  - - showText
    - The first call increases the counter before returning it.
  - - _setLine
    - 7
  - - _addValue
    - '1'
    - 0
    - int
  - - _assign
    - first
  - - showText
    - Keep that returned one as first.
  - - _setLine
    - 4
  - - _addValue
    - '2'
    - 0
    - int
  - - _assign
    - ticket
  - - _addValue
    - '2'
    - 0
    - int
  - - _assign
    - returned value
  - - showText
    - The next call reuses the counter, increasing one to two instead of initializing again.
  - - _setLine
    - 8
  - - _addValue
    - '2'
    - 0
    - int
  - - _assign
    - second
  - - showText
    - Keep the second returned ticket separately.
  - - _setLine
    - 9
  - - _addValue
    - 1 2
    - 0
    - std::string
  - - _assign
    - output
  - - showText
    - 'Display the issue order: first, then second.'
  lines:
  - '#include <iostream>'
  - int nextTicket() {
  - '    static int ticket{0};'
  - '    return ++ticket;'
  - '}'
  - int main() {
  - '    int first{nextTicket()};'
  - '    int second{nextTicket()};'
  - '    std::cout << first << '' '' << second << ''\n'';'
  - '}'
