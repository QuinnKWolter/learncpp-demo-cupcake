locale: en-US
id: cpp23-v2-07-scope-worked-example
title: Scope, duration, and linkage · worked example
description: Practice scope, duration, and linkage.
pedagogy:
  activity: worked-example
  difficulty: novice
  prereq_topics:
  - operators
  - precedence
  - remainder
  - boolean-logic
  - bit-flags
  topics:
  - scope
  - namespaces
  - shadowing
  - static-duration
