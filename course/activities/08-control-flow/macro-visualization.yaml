$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/macro-visualization/0.1.0
license: MIT
locale: en-US
id: cpp23-v2-08-control-flow-macro-visualization
title: Branches and loops · step through
description: Practice branches and loops.
pedagogy:
  activity: macro-visualization
  difficulty: novice
  prereq_topics:
  - scope
  - namespaces
  - shadowing
  - static-duration
  - linkage
  topics:
  - control-flow
  - loops
  - conditionals
  - accumulators
runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iostream>
    int main() {
        int limit{3};
        int total{0};
        for (int i{1}; i <= limit; ++i) {
            total += i;
        }
        std::cout << total << '\n';
    }
statement: |-
  Follow one fixed version of this module’s program. The limit changes. Add the values reached by the loop, including the limit when it is visited.

  Use Step to advance one explained state at a time. The highlighted line is the one just explained. These state labels are a teaching diagram, not the compiler’s physical memory layout. Predict output later gives you a changing version to solve yourself.
elements:
- settings:
    code: top
    heapHeight: 10
    stackHeight: 220
    width: 900
  init:
  - - createFrame
    - 0
    - Guided C++23 state
  - - createVariable
    - limit
  - - createVariable
    - total
  - - createVariable
    - i
  - - createVariable
    - output
  - - setLine
    - 2
  - - showText
    - Choose Step to begin. Follow the highlighted line, state labels, and explanation together.
  steps:
  - - _setLine
    - 3
  - - _addValue
    - '3'
    - 0
    - int
  - - _assign
    - limit
  - - showText
    - The walkthrough includes one through three.
  - - _setLine
    - 4
  - - _addValue
    - '0'
    - 0
    - int
  - - _assign
    - total
  - - showText
    - Before any loop visits, the running total is zero.
  - - _setLine
    - 5
  - - _addValue
    - '1'
    - 0
    - int
  - - _assign
    - i
  - - showText
    - Start i at one. One passes the inclusive limit check.
  - - _setLine
    - 6
  - - _addValue
    - '1'
    - 0
    - int
  - - _assign
    - total
  - - showText
    - The first contribution changes zero to one.
  - - _setLine
    - 5
  - - _addValue
    - '2'
    - 0
    - int
  - - _assign
    - i
  - - showText
    - Advance i to two. It still passes the condition.
  - - _setLine
    - 6
  - - _addValue
    - '3'
    - 0
    - int
  - - _assign
    - total
  - - showText
    - Add two to the previous one.
  - - _setLine
    - 5
  - - _addValue
    - '3'
    - 0
    - int
  - - _assign
    - i
  - - showText
    - Advance i to three. Equality is allowed by <=.
  - - _setLine
    - 6
  - - _addValue
    - '6'
    - 0
    - int
  - - _assign
    - total
  - - showText
    - Add three to the previous three.
  - - _setLine
    - 5
  - - _addValue
    - '4'
    - 0
    - int
  - - _assign
    - i
  - - showText
    - The next candidate is four, which fails the test. The body does not run again.
  - - _setLine
    - 8
  - - _addValue
    - out of scope
    - 0
    - std::string
  - - _assign
    - i
  - - _addValue
    - '6'
    - 0
    - std::string
  - - _assign
    - output
  - - showText
    - The loop has ended; its local i is no longer in scope. Print the completed total.
  lines:
  - '#include <iostream>'
  - int main() {
  - '    int limit{3};'
