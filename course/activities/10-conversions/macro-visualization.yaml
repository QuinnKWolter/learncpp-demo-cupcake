$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/macro-visualization/0.1.0
license: MIT
locale: en-US
id: cpp23-v2-10-conversions-macro-visualization
title: Conversions and type deduction · step through
description: Practice conversions and type deduction.
pedagogy:
  activity: macro-visualization
  difficulty: novice
  prereq_topics:
  - testing
  - input-validation
  - boundaries
  - stream-state
  topics:
  - conversions
  - narrowing
  - auto
  - type-aliases
runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iostream>
    int main() {
        int total{9};
        int count{2};
        auto average{static_cast<double>(total) / count};
        std::cout << average << '\n';
    }
statement: |-
  Follow one fixed version of this module’s program. The total changes. Follow the operand conversion and predict the quotient printed with the stream’s default formatting.

  Use Step to advance one explained state at a time. The highlighted line is the one just explained. These state labels are a teaching diagram, not the compiler’s physical memory layout. Predict output later gives you a changing version to solve yourself.
elements:
- settings:
    code: top
    heapHeight: 10
    stackHeight: 220
    width: 900
  init:
  - - createFrame
    - 0
    - Guided C++23 state
  - - createVariable
    - total
  - - createVariable
    - count
  - - createVariable
    - average
  - - createVariable
    - deduced type
  - - createVariable
    - output
  - - setLine
    - 2
  - - showText
    - Choose Step to begin. Follow the highlighted line, state labels, and explanation together.
  steps:
  - - _setLine
    - 3
  - - _addValue
    - '9'
    - 0
    - int
  - - _assign
    - total
  - - showText
    - The walkthrough total is nine, stored as an integer.
  - - _setLine
    - 4
  - - _addValue
    - '2'
    - 0
    - int
  - - _assign
    - count
  - - showText
    - The count is two.
  - - _setLine
    - 5
  - - _addValue
    - '4.5'
    - 0
    - std::string
  - - _assign
    - average
  - - _addValue
    - double
    - 0
    - std::string
  - - _assign
    - deduced type
  - - showText
    - A converted operand gives fractional division; auto follows that double result.
  - - _setLine
    - 6
  - - _addValue
    - '4.5'
    - 0
    - std::string
  - - _assign
    - output
  - - showText
    - Print four and a half. This trace does not request a fixed number of decimal places.
  lines:
  - '#include <iostream>'
  - int main() {
  - '    int total{9};'
  - '    int count{2};'
  - '    auto average{static_cast<double>(total) / count};'
  - '    std::cout << average << ''\n'';'
  - '}'
