$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/macro-visualization/0.1.0
license: MIT
locale: en-US
id: cpp23-v2-12-references-macro-visualization
title: References, pointers, and optional results · step through
description: Practice references, pointers, and optional results.
pedagogy:
  activity: macro-visualization
  difficulty: intermediate
  prereq_topics:
  - overloading
  - function-templates
  - constexpr
  topics:
  - references
  - pointers
  - nullability
  - optional
  - lifetime
runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iostream>
    int main() {
        int score{10};
        int& alias{score};
        alias += 5;
        std::cout << score << '\n';
    }
statement: |-
  Follow one fixed version of this module’s program. The original score changes. Follow the update through its alias and predict the value printed through the original name.

  Use Step to advance one explained state at a time. The highlighted line is the one just explained. These state labels are a teaching diagram, not the compiler’s physical memory layout. Predict output later gives you a changing version to solve yourself.
elements:
- settings:
    code: top
    heapHeight: 10
    stackHeight: 220
    width: 900
  init:
  - - createFrame
    - 0
    - Guided C++23 state
  - - createVariable
    - score
  - - createVariable
    - alias
  - - createVariable
    - output
  - - setLine
    - 2
  - - showText
    - Choose Step to begin. Follow the highlighted line, state labels, and explanation together.
  steps:
  - - _setLine
    - 3
  - - _addValue
    - '10'
    - 0
    - int
  - - _assign
    - score
  - - showText
    - Create one integer holding ten.
  - - _setLine
    - 4
  - - _addValue
    - refers to score
    - 0
    - std::string
  - - _assign
    - alias
  - - showText
    - Bind an alias to that same object, rather than copying ten into another integer.
  - - _setLine
    - 5
  - - _addValue
    - '15'
    - 0
    - int
  - - _assign
    - score
  - - showText
    - Update the one shared integer through its alias.
  - - _setLine
    - 6
  - - _addValue
    - '15'
    - 0
    - std::string
  - - _assign
    - output
  - - showText
    - The original name reads the updated shared value.
  lines:
  - '#include <iostream>'
  - int main() {
  - '    int score{10};'
  - '    int& alias{score};'
  - '    alias += 5;'
  - '    std::cout << score << ''\n'';'
  - '}'
