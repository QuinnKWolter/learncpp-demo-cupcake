$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/parsons-puzzles/0.1.0
license: MIT
locale: en-US
id: cpp23-v2-12-references-parsons-puzzles
title: References, pointers, and optional results · arrange code
description: Practice references, pointers, and optional results.
pedagogy:
  activity: parsons-puzzles
  difficulty: intermediate
  prereq_topics:
  - overloading
  - function-templates
  - constexpr
  topics:
  - references
  - pointers
  - nullability
  - optional
  - lifetime
runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iostream>
    int main() {
        int score{10};
        int& alias{score};
        alias += 5;
        std::cout << score << '\n';
    }
statement: |-
  Create score, bind an alias to it, increase the shared value by five, then print score.

  Move whole blocks into the highlighted slots. You do not need to edit their text. Prepare values before using them and print the requested final state.
hints:
- Create a live integer before binding a reference to it.
- A change through the reference affects that integer. Print after the change so the effect is visible.
elements:
- type: block
  location:
    snippet: '    int score{10};'
  choices:
  - snippet: '    int score{10};'
    role: solution
    indent: 4
    explanations:
    - body: The actual integer must exist before a reference can name it.
- type: block
  location:
    snippet: '    int& alias{score};'
  choices:
  - snippet: '    int& alias{score};'
    role: solution
    indent: 4
    explanations:
    - body: Bind another name to that same integer; do not create a separate copy.
- type: block
  location:
    snippet: '    alias += 5;'
  choices:
  - snippet: '    alias += 5;'
    role: solution
    indent: 4
    explanations:
    - body: Modify the shared integer through its reference.
- type: block
  location:
    snippet: '    std::cout << score << ''\n'';'
  choices:
  - snippet: '    std::cout << score << ''\n'';'
    role: solution
    indent: 4
    explanations:
    - body: Read the updated object through its original name.
testcases:
- title: Requested result
  visible: true
  stdin: []
  stdout: |
    15
