testcases:
- title: Positive
  visible: true
  stdin:
  - 1 2 3 4
  stdout: |
    4 6
  feedback:
    on_pass:
    - Both directions move independently with positive offsets.
    on_fail:
    - 'Both directions move independently with positive offsets. Keep the two directions separate: x changes
      by dx, and y changes by dy.'
- title: Signed
  visible: true
  stdin:
  - -5 6 2 -9
  stdout: |
    -3 -3
  feedback:
    on_pass:
    - Signed movement must affect only its matching coordinate.
    on_fail:
    - 'Signed movement must affect only its matching coordinate. Keep the two directions separate: x changes
      by dx, and y changes by dy.'
- title: Identity
  visible: true
  stdin:
  - 7 8 0 0
  stdout: |
    7 8
  feedback:
    on_pass:
    - Zero movement should return the original coordinates.
    on_fail:
    - 'Zero movement should return the original coordinates. Keep the two directions separate: x changes by
      dx, and y changes by dy.'
