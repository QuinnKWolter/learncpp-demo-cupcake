locale: en-US
id: cpp23-v2-13-records-free-coding
title: Enums, structs, and aggregate values · write code
description: Practice enums, structs, and aggregate values.
pedagogy:
  activity: free-coding
  difficulty: intermediate
  prereq_topics:
  - references
  - pointers
  - nullability
  - optional
  - lifetime
  topics:
  - structs
  - enum-classes
  - aggregates
  - members
runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iostream>
    struct Point { int x{}; int y{}; };
    Point translated(Point p, int dx, int dy) {
        return Point{p.x + dx, p.y + dy};
    }
    int main() {
        Point p{};
        int dx{}, dy{};
        std::cin >> p.x >> p.y >> dx >> dy;
        Point result{translated(p, dx, dy)};
        std::cout << result.x << ' ' << result.y << '\n';
    }
statement: |-
  Complete translated(Point p, int dx, int dy) by returning a new Point with x equal to p.x + dx and y equal to p.y + dy. Input contains x, y, dx, and dy, each from −100 to 100. The supplied caller reads these values and prints the returned x and y. Keep the two directions separate.

  Edit only the marked region. The other code is supplied for you to read and use. Check Answer tries the listed inputs; use their feedback to find which part of the rule needs another look.
hints:
- 'Keep the two directions separate: x changes by dx, and y changes by dy.'
- Construct the returned Point in its declared member order. Zero movement should return the original coordinates.
