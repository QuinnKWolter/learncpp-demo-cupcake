$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/macro-visualization/0.1.0
license: MIT
locale: en-US
id: cpp23-v2-13-records-macro-visualization
title: Enums, structs, and aggregate values · step through
description: Practice enums, structs, and aggregate values.
pedagogy:
  activity: macro-visualization
  difficulty: intermediate
  prereq_topics:
  - references
  - pointers
  - nullability
  - optional
  - lifetime
  topics:
  - structs
  - enum-classes
  - aggregates
  - members
runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iostream>
    struct Point { int x{}; int y{}; };
    int main() {
        Point start{4, 2};
        Point moved{start.x + 3, start.y - 1};
        std::cout << moved.x << ' ' << moved.y << '\n';
    }
statement: |-
  Follow one fixed version of this module’s program. The initial x coordinate changes. Predict the moved x and moved y, in declaration order.

  Use Step to advance one explained state at a time. The highlighted line is the one just explained. These state labels are a teaching diagram, not the compiler’s physical memory layout. Predict output later gives you a changing version to solve yourself.
elements:
- settings:
    code: top
    heapHeight: 10
    stackHeight: 220
    width: 900
  init:
  - - createFrame
    - 0
    - Guided C++23 state
  - - createVariable
    - start.x
  - - createVariable
    - start.y
  - - createVariable
    - moved.x
  - - createVariable
    - moved.y
  - - createVariable
    - output
  - - setLine
    - 2
  - - showText
    - Choose Step to begin. Follow the highlighted line, state labels, and explanation together.
  steps:
  - - _setLine
    - 4
  - - _addValue
    - '4'
    - 0
    - int
  - - _assign
    - start.x
  - - _addValue
    - '2'
    - 0
    - int
  - - _assign
    - start.y
  - - showText
    - 'Match the initializers to the named members: x first, y second.'
  - - _setLine
    - 5
  - - _addValue
    - '7'
    - 0
    - int
  - - _assign
    - moved.x
  - - _addValue
    - '1'
    - 0
    - int
  - - _assign
    - moved.y
  - - showText
    - 'Create a new point: add three horizontally and subtract one vertically. start is unchanged.'
  - - _setLine
    - 6
  - - _addValue
    - 7 1
    - 0
    - std::string
  - - _assign
    - output
  - - showText
    - Print the new point’s members in x-then-y order.
  lines:
  - '#include <iostream>'
  - struct Point { int x{}; int y{}; };
  - int main() {
  - '    Point start{4, 2};'
  - '    Point moved{start.x + 3, start.y - 1};'
  - '    std::cout << moved.x << '' '' << moved.y << ''\n'';'
  - '}'
