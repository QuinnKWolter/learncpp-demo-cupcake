id: cpp23-v2-13-records-worked-example
title: Enums, structs, and aggregate values · worked example
description: Practice enums, structs, and aggregate values.
pedagogy:
  activity: worked-example
  difficulty: intermediate
  prereq_topics:
  - references
  - pointers
  - nullability
  - optional
  - lifetime
  topics:
  - structs
  - enum-classes
  - aggregates
  - members
runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iostream>
    enum class Status { waiting, ready };
    struct Parcel {
        int weight{};
        Status status{Status::waiting};
    };
    int main() {
        Parcel parcel{4, Status::ready};
        if (parcel.status == Status::ready) {
            std::cout << parcel.weight << '\n';
        }
    }
statement: Read the small program and predict its result. Click the underlined pieces of code to see what each
  one contributes. Then compare your prediction with the sample run.
