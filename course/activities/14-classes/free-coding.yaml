runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iostream>
    class Counter {
        int value_{};
    public:
        explicit Counter(int start) : value_{start} {}
        void add(int amount) {
            if (amount > 0) {
                value_ += amount;
            }
        }
        int value() const { return value_; }
    };
    int main() {
        int start{}, amount{};
        std::cin >> start >> amount;
        Counter counter{start};
        counter.add(amount);
        const Counter& observed{counter};
        std::cout << observed.value() << '\n';
    }
statement: |-
  Complete the marked Counter::add body. Add amount to the stored value_ only when amount is positive; ignore zero and negative requests. Input is a starting count from 0 to 1000 and an amount from −1000 to 1000. The caller constructs the object, requests the update, and prints through the const observer.

  Edit only the marked region. The other code is supplied for you to read and use. Check Answer tries the listed inputs; use their feedback to find which part of the rule needs another look.
hints:
- Decide whether the requested amount is allowed before changing value_.
- A rejected zero or negative amount should leave the stored value exactly as it was. Update only in the positive
  branch.
