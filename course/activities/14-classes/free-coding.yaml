testcases:
- title: Positive
  visible: true
  stdin:
  - 10 5
  stdout: |
    15
  feedback:
    on_pass:
    - A positive request increases the stored count once.
    on_fail:
    - A positive request increases the stored count once. Decide whether the requested amount is allowed before
      changing value_.
- title: Negative
  visible: true
  stdin:
  - 10 -5
  stdout: |
    10
  feedback:
    on_pass:
    - A rejected negative request must preserve the old value.
    on_fail:
    - A rejected negative request must preserve the old value. Decide whether the requested amount is allowed
      before changing value_.
- title: Zero
  visible: true
  stdin:
  - 0 0
  stdout: |
    0
  feedback:
    on_pass:
    - A zero request should not introduce any change.
    on_fail:
    - A zero request should not introduce any change. Decide whether the requested amount is allowed before
      changing value_.
- title: Largest allowed positive addition
  visible: true
  stdin:
  - 0 1000
  stdout: |
    1000
  feedback:
    on_pass:
    - A large accepted request still follows the same guarded update.
    on_fail:
    - A large accepted request still follows the same guarded update. Decide whether the requested amount is
      allowed before changing value_.
