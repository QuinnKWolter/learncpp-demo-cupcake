runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iostream>
    class Counter {
        int value_{};
    public:
        explicit Counter(int start) : value_{start} {}
        void add(int amount) { if (amount > 0) { value_ += amount; } }
        int value() const { return value_; }
    };
    int main() {
        Counter counter{3};
        counter.add(2);
        std::cout << counter.value() << '\n';
    }
statement: |-
  Follow one fixed version of this module’s program. The requested addition changes. Apply the method’s positive-only rule before predicting the observer’s result.

  Use Step to advance one explained state at a time. The highlighted line is the one just explained. These state labels are a teaching diagram, not the compiler’s physical memory layout. Predict output later gives you a changing version to solve yourself.
