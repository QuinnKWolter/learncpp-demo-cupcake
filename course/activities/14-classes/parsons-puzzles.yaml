- type: block
  location:
    snippet: '    std::cout << counter.value() << ''\n'';'
  choices:
  - snippet: '    std::cout << counter.value() << ''\n'';'
    role: solution
    indent: 4
    explanations:
    - body: Observe the count after the update rather than printing the original count.
