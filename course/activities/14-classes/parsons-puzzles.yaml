runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iostream>
    class Counter {
        int value_{};
    public:
        explicit Counter(int start) : value_{start} {}
        void increment() { ++value_; }
        int value() const { return value_; }
    };
    int main() {
        Counter counter{3};
        counter.increment();
        std::cout << counter.value() << '\n';
    }
statement: |-
  Create a Counter starting at three, increment it once, and print its new value through the public observer.

  Move whole blocks into the highlighted slots. You do not need to edit their text. Prepare values before using them and print the requested final state.
hints:
- Create a Counter before calling a member function on it.
- Reading the count before increment would show the old value. Put the observer after the update when the task
  asks for the final count.
