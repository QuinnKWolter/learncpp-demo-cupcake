runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iostream>
    class Counter {
        int value_{};
    public:
        explicit Counter(int start) : value_{start} {}
        void increment() { ++value_; }
        int value() const { return value_; }
    };
    int main() {
        Counter counter{3};
        counter.increment();
        std::cout << counter.value() << '\n';
    }
