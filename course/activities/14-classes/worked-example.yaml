elements:
- type: explanation
  location:
    snippet: int value_{};
  explanations:
  - body: The stored count is private. The underscore is just a helpful naming convention.
- type: explanation
  location:
    snippet: 'explicit Counter(int start) : value_{start} {}'
  explanations:
  - body: Construct a new counter by initializing its member from start; the body has no extra work.
- type: explanation
  location:
    snippet: void increment() { ++value_; }
  explanations:
  - body: An action on this object increases its stored count by one.
- type: explanation
  location:
    snippet: int value() const { return value_; }
  explanations:
  - body: Read the count without changing it. const describes the observer’s behavior on the object.
