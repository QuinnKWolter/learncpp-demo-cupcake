source:
  main.cpp: |
    #include <iostream>
    #include <vector>
    int countPositive(const std::vector<int>& values) {
        int count{0};
        for (int value : values) {
            if (value > 0) { ++count; }
        }
        return count;
    }
    int main() {
        int n{};
        std::cin >> n;
        std::vector<int> values(n);
        for (int& value : values) { std::cin >> value; }
        std::cout << countPositive(values) << '\n';
    }
statement: |-
  Complete `countPositive(const std::vector<int>& values)` by returning how many elements are greater than zero. The supplied caller reads n (0–100), then n integers (−100 to 100), and prints your returned count. Do not change the vector. Zero is not positive, and an empty vector should give a count of zero.

  Edit only the marked region. The other code is supplied for you to read and use. Check Answer tries the listed inputs; use their feedback to find which part of the rule needs another look.
hints:
- Start count at zero and inspect each stored integer. Zero itself should not count as positive.
- Increase count only in the value > 0 case, then return once the loop has finished. An empty list should naturally
  return the starting zero.
