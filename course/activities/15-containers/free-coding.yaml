testcases:
- title: Mixed
  visible: true
  stdin:
  - '5'
  - -2 0 3 4 -1
  stdout: |
    2
  feedback:
    on_pass:
    - The count must ignore negatives and zero while including both positives.
    on_fail:
    - The count must ignore negatives and zero while including both positives. Start count at zero and inspect
      each stored integer. Zero itself should not count as positive.
- title: Empty
  visible: true
  stdin:
  - '0'
  stdout: |
    0
  feedback:
    on_pass:
    - An empty vector has no qualifying elements and needs no indexing.
    on_fail:
    - An empty vector has no qualifying elements and needs no indexing. Start count at zero and inspect each
      stored integer. Zero itself should not count as positive.
- title: All negative
  visible: true
  stdin:
  - '3'
  - -3 -2 -1
  stdout: |
    0
  feedback:
    on_pass:
    - An all-negative vector should not produce a positive count.
    on_fail:
    - An all-negative vector should not produce a positive count. Start count at zero and inspect each stored
      integer. Zero itself should not count as positive.
- title: One
  visible: true
  stdin:
  - '1'
  - '5'
  stdout: |
    1
  feedback:
    on_pass:
    - A one-element positive vector should count that element exactly once.
    on_fail:
    - A one-element positive vector should count that element exactly once. Start count at zero and inspect
      each stored integer. Zero itself should not count as positive.
- title: Every element qualifies
  visible: true
  stdin:
  - '4'
  - 1 2 3 4
  stdout: |
    4
  feedback:
    on_pass:
    - Every positive element contributes one, regardless of its numeric value.
    on_fail:
    - Every positive element contributes one, regardless of its numeric value. Start count at zero and inspect
      each stored integer. Zero itself should not count as positive.
