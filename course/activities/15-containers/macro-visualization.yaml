title: Vectors, arrays, iterators, and algorithms · step through
description: Practice vectors, arrays, iterators, and algorithms.
pedagogy:
  activity: macro-visualization
  difficulty: intermediate
  prereq_topics:
  - classes
  - constructors
  - const-members
  - invariants
  - destructors
  topics:
  - vector
  - array
  - range-for
  - algorithms
  - iterators
  - bounds
runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iostream>
    #include <vector>
    int main() {
        std::vector<int> values{2, -1, 0};
        int count{0};
        for (int value : values) {
            if (value > 0) { ++count; }
        }
        std::cout << count << '\n';
    }
statement: |-
  Follow one fixed version of this module’s program. The first vector element changes. Count strictly positive elements; do not add their values or count zero.

  Use Step to advance one explained state at a time. The highlighted line is the one just explained. These state labels are a teaching diagram, not the compiler’s physical memory layout. Predict output later gives you a changing version to solve yourself.
