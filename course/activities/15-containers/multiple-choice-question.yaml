title: Vectors, arrays, iterators, and algorithms · explain why
description: Practice vectors, arrays, iterators, and algorithms.
pedagogy:
  activity: multiple-choice-question
  difficulty: intermediate
  prereq_topics:
  - classes
  - constructors
  - const-members
