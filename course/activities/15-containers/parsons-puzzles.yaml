id: cpp23-v2-15-containers-parsons-puzzles
title: Vectors, arrays, iterators, and algorithms · arrange code
description: Practice vectors, arrays, iterators, and algorithms.
pedagogy:
  activity: parsons-puzzles
  difficulty: intermediate
  prereq_topics:
  - classes
  - constructors
  - const-members
  - invariants
  - destructors
  topics:
  - vector
  - array
  - range-for
  - algorithms
  - iterators
  - bounds
runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <algorithm>
    #include <iostream>
    #include <vector>
    int main() {
        std::vector<int> values{5, 1, 3};
        std::sort(values.begin(), values.end());
        for (int value : values) {
            std::cout << value << ' ';
        }
        std::cout << '\n';
    }
statement: |-
  Create the three-element vector, sort all of it, then print its elements in increasing order.

  Move whole blocks into the highlighted slots. You do not need to edit their text. Prepare values before using them and print the requested final state.
hints:
- Create the vector before using begin and end to describe it.
- The range loop prints the current order. Put sorting before it if the required display is sorted.
