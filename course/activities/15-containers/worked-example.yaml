runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <algorithm>
    #include <iostream>
    #include <vector>
    int main() {
        std::vector<int> values{5, 1, 3};
        std::sort(values.begin(), values.end());
        for (int value : values) {
            std::cout << value << ' ';
        }
        std::cout << '\n';
    }
statement: Read the small program and predict its result. Click the underlined pieces of code to see what each
  one contributes. Then compare your prediction with the sample run.
executions:
- title: Sample run
  stdin: []
  stdout: "1 3 5 \n"
  console: "1 3 5 \n"
  status: pass
elements:
- type: explanation
  location:
    snippet: std::vector<int> values{5, 1, 3};
  explanations:
  - body: Create an owning list containing these three integers, in this order.
- type: explanation
  location:
    snippet: std::sort(values.begin(), values.end());
  explanations:
  - body: Sort every existing element. The end marker is just beyond the final element.
- type: explanation
  location:
    snippet: 'for (int value : values)'
  explanations:
  - body: Read one element per loop visit; this loop does not change the vector.
- type: explanation
  location:
    snippet: std::cout << value << ' ';
  explanations:
  - body: Print each visited value followed by a space. The later output line adds the ending newline.
