runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iostream>
    int sumTo(int n) {
        if (n == 0) { return 0; }
        return n + sumTo(n - 1);
    }
    int main() {
        int n{};
        std::cin >> n;
        std::cout << sumTo(n) << '\n';
    }
statement: |-
  Complete `sumTo(int n)` using recursion (a call to the same function with a smaller input). Return the sum of whole numbers from 1 through n. For n = 0, return zero without another call. Input is n from 0 to 100. The supplied main prints the returned sum once.

  Edit only the marked region. The other code is supplied for you to read and use. Check Answer tries the listed inputs; use their feedback to find which part of the rule needs another look.
hints:
- First decide what the sum should be when there is nothing to add. That case should return without calling
  sumTo again.
- For a positive n, combine n with the sum for the smaller input n − 1. Eventually that smaller input reaches
  your stopping case.
