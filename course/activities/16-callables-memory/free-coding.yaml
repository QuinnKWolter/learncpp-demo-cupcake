      is nothing to add. That case should return without calling sumTo again.
- title: Limit
  visible: true
  stdin:
  - '100'
  stdout: |
    5050
  feedback:
    on_pass:
    - The upper input bound checks progress and the full resulting sum.
    on_fail:
