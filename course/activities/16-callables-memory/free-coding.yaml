testcases:
- title: Base
  visible: true
  stdin:
  - '0'
  stdout: |
    0
  feedback:
    on_pass:
    - Zero is the direct stopping case; no recursive call is needed.
    on_fail:
    - Zero is the direct stopping case; no recursive call is needed. First decide what the sum should be when
      there is nothing to add. That case should return without calling sumTo again.
- title: One
  visible: true
  stdin:
  - '1'
  stdout: |
    1
  feedback:
    on_pass:
    - One reaches the stopping case after one smaller request.
    on_fail:
    - One reaches the stopping case after one smaller request. First decide what the sum should be when there
      is nothing to add. That case should return without calling sumTo again.
- title: Several
  visible: true
  stdin:
