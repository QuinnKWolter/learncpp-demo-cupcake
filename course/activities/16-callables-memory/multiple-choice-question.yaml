question: What makes a recursive sum through n stop correctly when n reaches zero?
include_choices: 3
hints:
- The zero case must be reached without first making yet another recursive call.
- Changing n toward zero is necessary, but at zero the function must return an answer directly. Check the order
  of those two decisions.
choices:
- body: Return the zero-case answer before making another recursive call.
  role: solution
  explanations:
  - body: At zero there is no smaller sum to request. Returning directly lets the waiting calls finish.
- body: Make the recursive call first, then check whether n is zero.
  role: distractor
  explanations:
  - body: At zero that call happens before the check, so the intended stopping condition cannot stop it in
      time.
- body: Keep calling the same function with the same n until it stops by itself.
  role: distractor
  explanations:
  - body: Repeating an unchanged problem does not move toward a stopping case.
