$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/parameterized-code-tracing/0.1.0
license: MIT
locale: en-US
id: cpp23-v2-17-ownership-parameterized-code-tracing
title: Value operators, ownership, and relationships · predict output
description: Practice value operators, ownership, and relationships.
pedagogy:
  activity: parameterized-code-tracing
  difficulty: intermediate
  prereq_topics:
  - dynamic-allocation
  - recursion
  - lambdas
  - captures
  topics:
  - operator-overloading
  - unique-ptr
  - move-semantics
  - composition
  - ownership
runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iostream>
    #include <memory>
    #include <utility>
    int main() {
        auto original{std::make_unique<int>(7)};
        auto owner{std::move(original)};
        std::cout << *owner << ' ' << std::boolalpha << (original == nullptr) << '\n';
    }
statement: |-
  The owned integer changes. Predict its value after ownership transfer and the source-empty Boolean result.

  Type the program’s output, not source code. Values may change between attempts, so start with the values actually displayed. Keep any spaces between printed values and any separate output lines.
hints:
- 'Keep two facts separate: which pointer owns the object, and what integer the object holds.'
- Moving this owner changes responsibility, not the stored integer. The original == nullptr question therefore
  has its own Boolean answer.
elements:
- type: parameter
  location:
    snippet: '7'
  values:
  - 7
  - 0
  - -2
testcases:
- title: First-variant author reference
  visible: false
  stdin: []
  stdout: |
    7 true
