$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/parsons-puzzles/0.1.0
license: MIT
locale: en-US
id: cpp23-v2-17-ownership-parsons-puzzles
title: Value operators, ownership, and relationships · arrange code
description: Practice value operators, ownership, and relationships.
pedagogy:
  activity: parsons-puzzles
  difficulty: intermediate
  prereq_topics:
  - dynamic-allocation
  - recursion
  - lambdas
  - captures
  topics:
  - operator-overloading
  - unique-ptr
  - move-semantics
  - composition
  - ownership
runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iostream>
    #include <memory>
    #include <utility>
    int main() {
        auto original{std::make_unique<int>(7)};
        auto owner{std::move(original)};
        std::cout << *owner << ' ' << std::boolalpha << (original == nullptr) << '\n';
    }
statement: |-
  Create one owned integer, transfer its unique_ptr, then print the value and whether the source is empty.

  Move whole blocks into the highlighted slots. You do not need to edit their text. Prepare values before using them and print the requested final state.
hints:
- An owner must exist before its ownership can be transferred.
- Read through the destination after the transfer. The source unique_ptr is empty at that point.
elements:
- type: block
  location:
    snippet: '    auto original{std::make_unique<int>(7)};'
  choices:
  - snippet: '    auto original{std::make_unique<int>(7)};'
    role: solution
    indent: 4
    explanations:
    - body: Create the integer and give it one exclusive owner.
- type: block
  location:
    snippet: '    auto owner{std::move(original)};'
  choices:
  - snippet: '    auto owner{std::move(original)};'
    role: solution
    indent: 4
    explanations:
    - body: Transfer that existing ownership to the destination.
- type: block
  location:
    snippet: '    std::cout << *owner << '' '' << std::boolalpha << (original == nullptr) << ''\n'';'
  choices:
  - snippet: '    std::cout << *owner << '' '' << std::boolalpha << (original == nullptr) << ''\n'';'
    role: solution
    indent: 4
    explanations:
    - body: Observe the destination value and the source’s empty state after the move.
testcases:
- title: Requested result
  visible: true
  stdin: []
  stdout: |
    7 true
