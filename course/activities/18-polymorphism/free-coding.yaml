runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iostream>
    struct Shape {
        virtual int area() const = 0;
        virtual ~Shape() = default;
    };
    class Rectangle : public Shape {
        int width_, height_;
    public:
        Rectangle(int w, int h) : width_{w}, height_{h} {}
        int area() const override {
            return width_ * height_;
        }
    };
    int main() {
        int w{}, h{};
        std::cin >> w >> h;
        Rectangle rectangle{w, h};
        const Shape& shape{rectangle};
        std::cout << shape.area() << '\n';
    }
statement: |-
  Complete Rectangle’s supplied `area() const override` body. Return its stored width_ multiplied by its stored height_. The caller reads two dimensions from 1 to 100, constructs a Rectangle, and prints area through a const Shape reference. The constructor, interface, and output are already complete.

  Edit only the marked region. The other code is supplied for you to read and use. Check Answer tries the listed inputs; use their feedback to find which part of the rule needs another look.
hints:
- The constructor has already saved both dimensions. Area counts rows times columns, not the distance around
  the edges.
- Return the product of width_ and height_. Keep the supplied const override signature so the call through
  const Shape& can use it.
