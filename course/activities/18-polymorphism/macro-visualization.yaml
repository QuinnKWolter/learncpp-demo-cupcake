$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/macro-visualization/0.1.0
license: MIT
locale: en-US
id: cpp23-v2-18-polymorphism-macro-visualization
title: Inheritance and virtual dispatch · step through
description: Practice inheritance and virtual dispatch.
pedagogy:
  activity: macro-visualization
  difficulty: intermediate
  prereq_topics:
  - operator-overloading
  - unique-ptr
  - move-semantics
  - composition
  - ownership
  topics:
  - inheritance
  - virtual-functions
  - override
  - slicing
  - polymorphism
runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iostream>
    struct Base {
        virtual int value() const { return 1; }
        virtual ~Base() = default;
    };
    struct Derived : Base {
        int value() const override { return 2; }
    };
    int main() {
        Derived derived;
        const Base& base{derived};
        std::cout << base.value() << '\n';
    }
statement: |-
  Follow one fixed version of this module’s program. The value returned by Derived changes. Predict the virtual call through Base& without treating that reference as a sliced copy.

  Use Step to advance one explained state at a time. The highlighted line is the one just explained. These state labels are a teaching diagram, not the compiler’s physical memory layout. Predict output later gives you a changing version to solve yourself.
