testcases:
- title: Positive
  visible: true
  stdin:
  - 3 7
  stdout: |
    10 3.75
  feedback:
    on_pass:
    - The integer sum and the double sum must both use the same template pattern.
    on_fail:
    - The integer sum and the double sum must both use the same template pattern. The constructor has already
      stored the two T values. The observer only needs to combine them.
- title: Signed
  visible: true
  stdin:
  - -5 2
  stdout: |
    -3 3.75
  feedback:
    on_pass:
    - Signed integer operands must keep their sign while the double result keeps its fraction.
    on_fail:
    - Signed integer operands must keep their sign while the double result keeps its fraction. The constructor
      has already stored the two T values. The observer only needs to combine them.
- title: Zero
  visible: true
  stdin:
  - 0 0
  stdout: |
    0 3.75
  feedback:
    on_pass:
    - A zero integer sum must not affect the independent fractional pair.
    on_fail:
    - A zero integer sum must not affect the independent fractional pair. The constructor has already stored
      the two T values. The observer only needs to combine them.
