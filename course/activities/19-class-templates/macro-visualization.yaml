$schema: https://adapt2.sis.pitt.edu/cupcake/schemas/macro-visualization/0.1.0
license: MIT
locale: en-US
id: cpp23-v2-19-class-templates-macro-visualization
title: Class templates and specialization · step through
description: Practice class templates and specialization.
pedagogy:
  activity: macro-visualization
  difficulty: intermediate
  prereq_topics:
  - inheritance
  - virtual-functions
  - override
  - slicing
  - polymorphism
  topics:
  - class-templates
  - non-type-parameters
  - specialization
runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iostream>
    template <typename T>
    class Box {
        T value_;
    public:
        explicit Box(T value) : value_{value} {}
        T value() const { return value_; }
    };
    int main() {
        Box<int> box{8};
        std::cout << box.value() << '\n';
    }
statement: |-
  Follow one fixed version of this module’s program. The constructor argument changes. Follow storage in Box<int> and its unchanged value returned by the observer.

  Use Step to advance one explained state at a time. The highlighted line is the one just explained. These state labels are a teaching diagram, not the compiler’s physical memory layout. Predict output later gives you a changing version to solve yourself.
