runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iostream>
    template <typename T>
    class Box {
        T value_;
    public:
        explicit Box(T value) : value_{value} {}
        T value() const { return value_; }
    };
    int main() {
        Box<int> integer{8};
        Box<double> fraction{2.5};
        std::cout << integer.value() << ' ' << fraction.value() << '\n';
    }
statement: Read the small program and predict its result. Click the underlined pieces of code to see what each
  one contributes. Then compare your prediction with the sample run.
executions:
- title: Sample run
  stdin: []
