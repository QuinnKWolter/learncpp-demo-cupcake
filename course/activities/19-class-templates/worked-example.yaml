  status: pass
elements:
- type: explanation
  location:
    snippet: template <typename T>
  explanations:
  - body: This class is a pattern whose member and result types are chosen by its template argument.
- type: explanation
  location:
    snippet: 'explicit Box(T value) : value_{value} {}'
  explanations:
  - body: Store the constructor argument in the member with the same chosen type.
- type: explanation
  location:
    snippet: T value() const { return value_; }
  explanations:
  - body: Return the stored value without changing it or converting it to a fixed type.
- type: explanation
  location:
    snippet: Box<double> fraction{2.5};
  explanations:
  - body: This is a separate double-valued instantiation; its fraction should survive observation.
