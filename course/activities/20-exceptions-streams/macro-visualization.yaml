license: MIT
locale: en-US
id: cpp23-v2-20-exceptions-streams-macro-visualization
title: Exceptions and stream-based I/O · step through
description: Practice exceptions and stream-based i/o.
pedagogy:
  activity: macro-visualization
  difficulty: intermediate
  prereq_topics:
  - class-templates
  - non-type-parameters
  - specialization
  topics:
  - exceptions
  - stack-unwinding
  - streams
  - parsing
  - file-io
runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iostream>
    #include <stdexcept>
    int checkedDivide(int numerator, int denominator) {
        if (denominator == 0) { throw std::invalid_argument{"zero"}; }
        return numerator / denominator;
    }
    int main() {
        int denominator{0};
        try {
            std::cout << checkedDivide(12, denominator) << '\n';
        } catch (const std::exception& error) {
            std::cout << error.what() << '\n';
        }
    }
statement: |-
  Follow one fixed version of this module’s program. The denominator changes. Decide whether the function returns normally or throws, then predict the one printed line.

  Use Step to advance one explained state at a time. The highlighted line is the one just explained. These state labels are a teaching diagram, not the compiler’s physical memory layout. Predict output later gives you a changing version to solve yourself.
