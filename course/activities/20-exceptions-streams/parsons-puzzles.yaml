runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iostream>
    #include <stdexcept>
    int checkedDivide(int numerator, int denominator) {
        if (denominator == 0) { throw std::invalid_argument{"zero"}; }
        return numerator / denominator;
    }
    int main() {
        int numerator{12};
        int denominator{0};
        try {
            std::cout << checkedDivide(numerator, denominator) << '\n';
        } catch (const std::exception& error) {
            std::cout << error.what() << '\n';
        }
    }
statement: |-
  Prepare 12 and a zero divisor, then use the supplied checkedDivide inside a try/catch so its error message is printed.

  Move whole blocks into the highlighted slots. You do not need to edit their text. Prepare values before using them and print the requested final state.
hints:
- The try block contains the operation that can fail; the matching handler deals with its thrown exception.
- The output after a successful call belongs on the normal path. The handler’s output belongs only on the failure
  path.
