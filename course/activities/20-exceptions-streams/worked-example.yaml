source:
  main.cpp: |
    #include <iostream>
    #include <stdexcept>
    int checkedDivide(int numerator, int denominator) {
        if (denominator == 0) { throw std::invalid_argument{"zero"}; }
        return numerator / denominator;
    }
    int main() {
        try {
            std::cout << checkedDivide(12, 3) << '\n';
            std::cout << checkedDivide(0, 3) << '\n';
            std::cout << checkedDivide(12, 0) << '\n';
        } catch (const std::exception& error) {
            std::cout << error.what() << '\n';
        }
    }
statement: Read the small program and predict its result. Click the underlined pieces of code to see what each
  one contributes. Then compare your prediction with the sample run.
