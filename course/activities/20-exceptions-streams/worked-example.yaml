elements:
- type: explanation
  location:
    snippet: denominator == 0
  explanations:
  - body: Check the divisor, because a zero divisor makes division invalid. A zero numerator is allowed.
- type: explanation
  location:
    snippet: throw std::invalid_argument{"zero"};
  explanations:
  - body: Signal the failure with a standard error object whose message is zero; do not compute a quotient
      on this path.
- type: explanation
  location:
    snippet: try {
  explanations:
  - body: Begin the normal path that may transfer control to a handler if a call throws.
- type: explanation
  location:
    snippet: catch (const std::exception& error)
  explanations:
  - body: Catch and observe a standard exception. Its what() message can explain the failure.
