testcases:
- title: Workflow
  visible: true
  stdin:
  - 5 4
  - add 3
  - take 2
  - take 10
  - take 6
  stdout: |
    ok 8
    ok 6
    rejected 6
    ok 0
  feedback:
    on_pass:
    - A transaction sequence checks accepted changes, overdraft rejection, and an exact-stock take.
    on_fail:
    - A transaction sequence checks accepted changes, overdraft rejection, and an exact-stock take. Separate
      the decision from the update. Reject any invalid amount before touching stock_.
- title: Rejected amounts
  visible: true
  stdin:
  - 4 3
  - add 0
  - take -2
  - add -3
  stdout: |
    rejected 4
    rejected 4
    rejected 4
  feedback:
    on_pass:
    - Zero and negative amounts must be rejected without changing the count.
    on_fail:
    - Zero and negative amounts must be rejected without changing the count. Separate the decision from the
      update. Reject any invalid amount before touching stock_.
- title: Empty inventory
  visible: true
  stdin:
  - 0 3
  - take 1
  - add 2
  - take 2
  stdout: |
    rejected 0
    ok 2
    ok 0
  feedback:
    on_pass:
    - An empty inventory can accept stock later and then permit an exact take.
    on_fail:
    - An empty inventory can accept stock later and then permit an exact take. Separate the decision from the
      update. Reject any invalid amount before touching stock_.
- title: No commands
