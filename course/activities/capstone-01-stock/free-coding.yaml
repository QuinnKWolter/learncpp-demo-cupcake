id: cpp23-v2-capstone-01-stock-free-coding
title: 'Capstone: a small stock controller'
description: 'Practice capstone: a small stock controller.'
pedagogy:
  activity: free-coding
  difficulty: advanced
  prereq_topics:
  - structs
  - enum-classes
  - aggregates
  - members
  topics:
  - classes
  - invariants
  - control-flow
  - input-validation
runtime:
  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iostream>
    #include <string>
    class Inventory {
        int stock_;
    public:
        explicit Inventory(int initial) : stock_{initial} {}
        bool add(int amount) {
            if (amount <= 0) { return false; }
            stock_ += amount;
            return true;
        }
        bool take(int amount) {
            if (amount <= 0 || amount > stock_) { return false; }
            stock_ -= amount;
            return true;
        }
        int stock() const { return stock_; }
    };
    int main() {
        int initial{}, commands{};
        std::cin >> initial >> commands;
        Inventory inventory{initial};
        for (int i{0}; i < commands; ++i) {
            std::string action;
            int amount{};
            std::cin >> action >> amount;
            bool accepted{action == "add" ? inventory.add(amount) : inventory.take(amount)};
            std::cout << (accepted ? "ok " : "rejected ") << inventory.stock() << '\n';
        }
    }
statement: |-
  Implement the Inventory methods. Initial stock is nonnegative. `add(amount)` returns true and adds amount only when amount > 0. `take(amount)` returns true and subtracts amount only when 0 < amount <= stock. A rejected request returns false and leaves stock unchanged. Input is initial-stock and command-count, then that many `add n` or `take n` commands. Print `ok stock` or `rejected stock` after each command. Initial stock, command count, and all amounts have magnitude at most 100; command count is nonnegative.

  The two highlighted method/function bodies are yours to complete. Read the preparation notes and examples before editing; the surrounding program is supplied.
hints:
- Separate the decision from the update. Reject any invalid amount before touching stock_.
- For take, ask both “is it positive?” and “is there enough stock?” Exact-stock withdrawal is allowed.
- After an accepted update, return true. A rejected request must return false with stock_ exactly as it was.
