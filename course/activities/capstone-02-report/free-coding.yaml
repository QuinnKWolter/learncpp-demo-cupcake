testcases:
- title: Normal
  visible: true
  stdin:
  - '3'
  - Ada 80
  - Bjarne 95
  - Grace 95
  stdout: |
    count 3
    average 90.0
    best Bjarne 95
  feedback:
    on_pass:
    - The first highest-scoring name should survive a tie.
    on_fail:
    - The first highest-scoring name should survive a tie. Keep parsing and reporting separate. Validate into
      a temporary record before changing result.
- title: Empty
  visible: true
  stdin:
  - '0'
  stdout: |
    count 0
    average 0.0
    best none
  feedback:
    on_pass:
    - An empty report must avoid division by zero and use best none.
    on_fail:
    - An empty report must avoid division by zero and use best none. Keep parsing and reporting separate. Validate
      into a temporary record before changing result.
- title: Boundaries
  visible: true
  stdin:
  - '2'
  - Ada 0
  - Grace 100
  stdout: |
    count 2
    average 50.0
    best Grace 100
  feedback:
    on_pass:
    - Both score endpoints are valid and should affect the average.
    on_fail:
    - Both score endpoints are valid and should affect the average. Keep parsing and reporting separate. Validate
      into a temporary record before changing result.
- title: Extra token
  visible: true
  stdin:
  - '1'
  - Ada 90 extra
  stdout: |
    invalid
  feedback:
    on_pass:
    - An extra token makes the complete record invalid.
    on_fail:
    - An extra token makes the complete record invalid. Keep parsing and reporting separate. Validate into
      a temporary record before changing result.
- title: Out of range
  visible: true
  stdin:
  - '1'
  - Ada 101
  stdout: |
    invalid
  feedback:
    on_pass:
    - A score above one hundred is invalid even if it parses.
    on_fail:
    - A score above one hundred is invalid even if it parses. Keep parsing and reporting separate. Validate
      into a temporary record before changing result.
- title: Missing score
  visible: true
