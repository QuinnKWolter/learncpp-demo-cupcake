  language: cpp
  version: '23'
source:
  main.cpp: |
    #include <iomanip>
    #include <iostream>
    #include <limits>
    #include <sstream>
    #include <string>
    #include <vector>
    struct Record { std::string name; int score{}; };
    bool parseRecord(const std::string& line, Record& result) {
        std::istringstream input{line};
        Record candidate;
        std::string extra;
        if (!(input >> candidate.name >> candidate.score) || candidate.score < 0 || candidate.score > 100 || (input >> extra)) {
            return false;
        }
        result = candidate;
        return true;
    }
    void printReport(const std::vector<Record>& records) {
        int total{0};
        const Record* best{nullptr};
        for (const Record& record : records) {
            total += record.score;
            if (best == nullptr || record.score > best->score) { best = &record; }
        }
        double average{records.empty() ? 0.0 : static_cast<double>(total) / records.size()};
        std::cout << "count " << records.size() << '\n';
        std::cout << "average " << std::fixed << std::setprecision(1) << average << '\n';
        if (best) { std::cout << "best " << best->name << ' ' << best->score << '\n'; }
        else { std::cout << "best none\n"; }
    }
    int main() {
        int count{};
        std::cin >> count;
        std::cin.ignore(std::numeric_limits<std::streamsize>::max(), '\n');
        std::vector<Record> records;
        for (int i{0}; i < count; ++i) {
            std::string line;
            std::getline(std::cin, line);
            Record record;
            if (!parseRecord(line, record)) { std::cout << "invalid\n"; return 0; }
            records.push_back(record);
        }
        printReport(records);
    }
statement: |-
  Implement `bool parseRecord(const std::string& line, Record& result)` and `void printReport(const std::vector<Record>& records)`. A valid line contains exactly a single-word name and one integer score in [0,100], with no extra token. parseRecord returns false for any invalid line and assigns result only for a valid line. main reads a nonnegative line count followed by those lines (at most 100). If any line is invalid, main prints `invalid` and stops. Otherwise print `count N`, `average A` with one decimal place, and `best NAME SCORE` on separate lines. For an empty collection print `count 0`, `average 0.0`, and `best none`. For a tie, select the FIRST record with the highest score. Names contain only ASCII letters; test inputs obey the line-count contract.

  The two highlighted method/function bodies are yours to complete. Read the preparation notes and examples before editing; the surrounding program is supplied.
hints:
- Keep parsing and reporting separate. Validate into a temporary record before changing result.
- 'Two successful fields are not enough: a range violation or one leftover token must reject the line.'
- In the report, handle the empty vector before division and update best only for a strictly larger score.
  That protects zero records and first-in-order ties.
