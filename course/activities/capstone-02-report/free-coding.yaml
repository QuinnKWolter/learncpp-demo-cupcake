- title: Fractional average
  visible: true
  stdin:
  - '2'
  - Ada 10
  - Grace 11
  stdout: |
    count 2
    average 10.5
    best Grace 11
  feedback:
    on_pass:
    - The average needs its fractional half.
    on_fail:
    - The average needs its fractional half. Keep parsing and reporting separate. Validate into a temporary
      record before changing result.
- title: Zero scores still have a best record
  visible: true
  stdin:
  - '2'
