# Schema 2.2 works with standalone docker-compose >=1.13 and Docker 18.09.
# Version 2.x also enforces these local resource limits without Swarm.
version: "2.2"
services:
  cupcake-lab__webapp:
    # MODE SWITCH: replace the next line with `build: .` for a source build.
    image: ${CUPCAKE_IMAGE:-cupcake-lab:latest}
    container_name: cupcake-lab__webapp
    ports:
      # Apache on this host is the authentication/access-control boundary.
      - "127.0.0.1:20700:5173"
    environment:
      CUPCAKE_BASE_PATH: /cupcake-lab
      CUPCAKE_PUBLIC_ORIGIN: https://adapt2.sis.pitt.edu
    init: true
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /app/.runtime:rw,exec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=0700
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 1g
    cpu_period: 100000
    cpu_quota: 200000
    ulimits:
      core: 0
      nofile:
        soft: 1024
        hard: 1024
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
